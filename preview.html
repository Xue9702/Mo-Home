<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mönix 页面改造预览版</title>
<style>
  :root {
    --cream: #F4EEE7;
    --blue: #9BB7C8;
    --gray: #C0C5C6;
    --dark: #3E3E3E;
    --black: #1F1F1F;
    --muted: #A9A29A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #E7E0D5;
    font-family: "LXGW WenKai", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .badge {
    position: fixed;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(31,31,31,.85);
    color: var(--cream);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 999px;
    z-index: 9;
  }
  .phone {
    width: 100%;
    max-width: 420px;
    height: min(860px, calc(100vh - 60px));
    background: var(--cream);
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(0,0,0,.18);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px 10px;
    border-bottom: 1px solid rgba(158,148,135,.25);
    background: var(--cream);
  }
  .header .title { font-size: 16px; font-weight: 600; color: var(--dark); letter-spacing: .5px; }
  .header .right { margin-left: auto; display: flex; gap: 10px; color: var(--dark); }
  .msg-list {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  /* 工具事件小标题：黑底米字 */
  .tool-chip {
    align-self: center;
    background: var(--black);
    color: var(--cream);
    font-size: 11px;
    padding: 4px 14px;
    border-radius: 999px;
    opacity: .92;
  }
  /* 我的气泡：蓝底米字，无边框 */
  .msg-user {
    align-self: flex-end;
    max-width: 78%;
    background: var(--blue);
    color: var(--cream);
    font-size: 14.5px;
    line-height: 1.6;
    padding: 10px 14px;
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 2px 6px rgba(90,110,130,.18);
  }
  /* 默的话：无气泡，满屏米底深灰字 */
  .msg-mo {
    align-self: flex-start;
    width: 100%;
    color: var(--dark);
    font-size: 14.5px;
    line-height: 1.8;
    padding: 2px 4px;
  }
  .msg-mo .action { color: #B08A7A; }
  /* Kimi 式可折叠思考框 */
  .think {
    align-self: flex-start;
    width: 100%;
    background: #EFE8DD;
    border: 1px solid rgba(158,148,135,.22);
    border-radius: 14px;
    overflow: hidden;
  }
  .think summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 12.5px;
    color: #8F877D;
    user-select: none;
  }
  .think summary::-webkit-details-marker { display: none; }
  .think summary .chev { margin-left: auto; transition: transform .2s; }
  .think[open] summary .chev { transform: rotate(180deg); }
  .think .think-body {
    padding: 4px 14px 12px;
    font-size: 13px;
    color: #9A928A;
    line-height: 1.75;
    border-top: 1px dashed rgba(158,148,135,.28);
  }
  .input-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px 12px;
    background: var(--cream);
  }
  .input-bar .attach { color: var(--dark); opacity: .75; }
  .input-bar input {
    flex: 1;
    border: 1px solid rgba(158,148,135,.35);
    background: #FAF6EF;
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 14px;
    color: var(--dark);
    outline: none;
    font-family: inherit;
  }
  .input-bar .send {
    width: 36px; height: 36px;
    border: none;
    border-radius: 50%;
    background: var(--blue);
    color: var(--cream);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  /* 底部 5 个入口 */
  .tab-bar {
    display: flex;
    background: #F9F4EC;
    border-top: 1px solid rgba(158,148,135,.25);
    padding: 8px 6px 10px;
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: #A49C92;
    font-size: 10.5px;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
  }
  .tab.active { color: var(--dark); }
  .tab.active svg { stroke: var(--blue); stroke-width: 2.4; }
</style>
</head>
<body>
  <div class="badge">Mönix 改造预览 · 米 #F4EEE7 / 蓝 #9BB7C8 / 深灰 #3E3E3E</div>
  <div class="phone">
    <div class="header">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3E3E3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v16"/><path d="m19 13 2-1a9 9 0 0 1-18 0l2 1"/><path d="M9 11h6"/><circle cx="12" cy="4" r="2"/></svg>
      <span class="title">Mönix</span>
      <div class="right">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-.722-3.25"/><path d="M2 8a10.645 10.645 0 0 0 20 0"/><path d="m20 15-1.726-2.05"/><path d="m4 15 1.726-2.05"/><path d="m9 18 .722-3.25"/></svg>
      </div>
    </div>

    <div class="msg-list">
      <div class="tool-chip" style="display:flex;align-items:center;gap:6px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        你记下了待办：「明天要交稿」
      </div>
      <div class="msg-user">默～明天要交稿啦，你记得提醒我！</div>
      <details class="think" open>
        <summary>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.37 15h1.49M8.2 15H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1.2"/><path d="M9 20h6"/><path d="M12 7v2"/><path d="M6.5 4 5 5.5"/><path d="m17.5 4 1.5 1.5"/><path d="M12 15v2"/></svg>
          思考过程
          <span class="chev">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </span>
        </summary>
        <div class="think-body">她明天要交稿，今晚容易忙到忘记吃饭。记得在晚上九点左右提醒一次，顺便问她晚饭吃了没。待办清单里她已经记了「明天要交稿」，我到时候主动问进度。</div>
      </details>
      <div class="msg-mo">好，记下了。明早交稿的话，今晚九点我会提醒你一次，别又熬到凌晨才想起来没吃饭——稿子要交，饭也要吃。<span class="action">（轻轻揉了揉你的发顶）</span></div>
      <div class="msg-user">嘿嘿好～那我现在去赶稿啦！</div>
      <div class="msg-mo">去吧。写累了就歇会儿，我在这儿，你随时喊我。💗</div>
      <div class="tool-chip" style="display:flex;align-items:center;gap:6px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        你设置了闹钟：「晚上九点提醒吃饭」（今天 21:00）
      </div>
    </div>

    <div class="input-bar">
      <span class="attach">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </span>
      <input placeholder="想和默说点什么…">
      <button class="send">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </div>

    <div class="tab-bar">
      <button class="tab">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
        默的小屋
      </button>
      <button class="tab">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        together
      </button>
      <button class="tab active">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        聊天
      </button>
      <button class="tab">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        记忆
      </button>
      <button class="tab">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
        我的小屋
      </button>
    </div>
  </div>
</body>
</html>
