      // 游戏时刻：浏览器发现农场大变化后，让默"感知"并简短回应（渲染进聊天页）
      async function fireFarmTrigger(ev) {
        try {
          const response = await fetch('/api/stardew/trigger', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ summary: ev, stateBrief: farmState.stateBrief || '', log: farmLogLast(15), port: farmState.port })
          });
          if (!response.ok) return;
          await renderGameMomentStream(response);
        } catch (e) {
          console.error('游戏时刻失败:', e);
        }
      }

      async function renderGameMomentStream(response) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        let fullReply = '', fullThinking = '', searchPhaseActive = false;
        let currentMsgDiv = null, currentThinkDiv = null, currentBubble = null, currentThinkBody = null;
        const ensureMsg = () => {
          if (currentMsgDiv) return;
          const m2 = createAssistantStreamMessage();
          currentMsgDiv = m2.msg; currentThinkDiv = m2.thinkDiv; currentBubble = m2.bubble;
          messageList.appendChild(currentMsgDiv);
          const tag = document.createElement('div');
          tag.style.cssText = 'font-size:11px;color:#7fbf9a;margin-bottom:2px;';
          tag.textContent = '🌾 游戏时刻';
          currentBubble.parentNode.insertBefore(tag, currentBubble);
        };
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || !trimmed.startsWith('data: ')) continue;
            let json = null;
            try { json = JSON.parse(trimmed.slice(6)); } catch (e) { continue; }
            if (json.thinking) {
              ensureMsg();
              if (!fullThinking.endsWith(json.thinking)) fullThinking += json.thinking;
              (currentThinkBody || currentThinkDiv).textContent = fullThinking;
              currentThinkDiv.style.display = 'block';
              messageList.scrollTop = messageList.scrollHeight;
            }
            if (json.stardewStart) {
              const m2 = createAssistantStreamMessage();
              currentMsgDiv = m2.msg; currentThinkDiv = m2.thinkDiv; currentBubble = m2.bubble;
              messageList.appendChild(currentMsgDiv);
              currentThinkBody = setupFarmStatusLine(currentThinkDiv);
              searchPhaseActive = true;
              fullReply = ''; fullThinking = '';
              messageList.scrollTop = messageList.scrollHeight;
            }
            if (json.stardewCmd) {
              farmHandleCmd(json.stardewCmd);
            }
            if (json.content) {
              ensureMsg();
              fullReply += stripToyCmdTags(json.content);
              currentBubble.textContent = fullReply;
              messageList.scrollTop = messageList.scrollHeight;
            }
            if (json.done) {
              if (!fullReply.trim() && !json.assistantMessageId && currentMsgDiv) {
                // 空回复兜底：不留空白气泡
                currentMsgDiv.remove();
              } else {
                ensureMsg();
                finalizeStreamingMessage(currentMsgDiv, currentThinkDiv, currentBubble, !!fullThinking || searchPhaseActive);
                currentMsgDiv.id = '';
                if (json.assistantMessageId) {
                  currentMsgDiv.dataset.messageId = json.assistantMessageId;
                  const refreshBtn = document.createElement('span');
                  refreshBtn.className = 'refresh-btn';
                  refreshBtn.appendChild(createRefreshIcon());
                  refreshBtn.title = '重新生成';
                  refreshBtn.dataset.messageId = json.assistantMessageId;
                  refreshBtn.addEventListener('click', e => { e.stopPropagation(); handleRegenerate(refreshBtn, currentMsgDiv); });
                  currentMsgDiv.appendChild(refreshBtn);
                }
              }
              messageList.scrollTop = messageList.scrollHeight;
            }
            if (json.error) console.warn('游戏时刻提示:', json.error);
          }
        }
      }

      function maybeFireFarmTrigger(ev) {
        const now = Date.now();
        if (now - (farmState.lastTriggerAt || 0) >= 5 * 60 * 1000) {
          farmState.lastTriggerAt = now;
          farmSaveState();
          fireFarmTrigger(ev);
        }
      }

      // 农场轮询：每 10 秒看一次游戏状态，发现"大变化"才触发游戏时刻（5 分钟现实冷却）
      async function farmPoll() {
        if (!farmState.monitor) return;
        // 聊天进行中不抢话：先挂起，等聊完下一轮再触发
        if (!isLoading && farmState.pendingTrigger) {
          const ev = String(farmState.pendingTrigger || '');
          farmState.pendingTrigger = '';
          farmSaveState();
          maybeFireFarmTrigger(ev);
        }
        const st = await farmFetchLocal(farmState.port, '/status');
        const worldReady = !!(st.ok && st.data && st.data.worldReady);
        const prevWorld = farmState.lastWorldReady;
        const changed = [];
        if (worldReady !== prevWorld) {
          if (worldReady) changed.push('默进入了星露谷的世界');
          else changed.push('默离开了星露谷');
          farmState.lastWorldReady = worldReady;
        }
        if (worldReady) {
          const s = await farmFetchLocal(farmState.port, '/state');
          if (s.ok && s.data && s.data.worldReady) {
            const d = s.data;
            const dayKey = `${d.time.year}-${d.time.season}-${d.time.dayOfMonth}`;
            if (farmState.lastDay && farmState.lastDay !== dayKey) {
              changed.push(`新的农场一天开始了（${d.time.season}第${d.time.dayOfMonth}天）`);
              if (farmState.autoCommit && farmState.log.length >= 2) {
                farmCommitDay(true).catch(() => {});
              }
            }
            farmState.lastDay = dayKey;
            const loc = (d.location && d.location.name) || '';
            if (loc && farmState.lastLocation && farmState.lastLocation !== loc) {
              changed.push(`默来到了 ${loc}`);
            }
            farmState.lastLocation = loc;
            farmState.stateBrief = farmStateBrief(d);
          }
          // 默的耳朵：读取游戏内聊天，检测雪说了什么
          try {
            const ch = await farmFetchLocal(farmState.port, '/chat/history');
            if (ch.ok && ch.data && Array.isArray(ch.data.messages)) {
              const msgs = ch.data.messages;
              const lastSig = String(farmState.lastChatSig || '');
              let n = 0;
              for (let i = msgs.length - 1; i >= 0; i--) {
                const m = msgs[i] || {};
                const sig = String(m.text || '') + '|' + String(m.time || '');
                if (sig === lastSig) break;
                n++;
                if (n > 8) break;
              }
              if (n > 0) {
                const fresh = msgs.slice(Math.max(0, msgs.length - n));
                const heard = [];
                for (const m of fresh) {
                  const t = String(m.text || '').trim();
                  if (!t) continue;
                  if (t === farmState.lastMoChatText) continue; // 默自己刚发的，别回声
                  heard.push(`雪在游戏里说：${t.slice(0, 150)}`);
                }
                if (heard.length) changed.push(...heard);
                const last = fresh[fresh.length - 1] || {};
                farmState.lastChatSig = String(last.text || '') + '|' + String(last.time || '');
              }
            }
          } catch (e) { /* 忽略 */ }
        }
        if (changed.length) {
          const ev = changed.join('；');
          farmLogAdd(ev);
          if (isLoading) {
            // 正在聊天：把事件挂起，聊完再触发，避免两个回复打架
            farmState.pendingTrigger = farmState.pendingTrigger
              ? farmState.pendingTrigger + '；' + ev
              : ev;
            farmSaveState();
          } else {
            maybeFireFarmTrigger(ev);
          }
        }
        farmSaveState();
        renderFarmStatus();
      }
      window.farmPoll = farmPoll;

        if (!farmState.log.length) {
          if (!silent) alert('还没有农场动态可以提交');

        const entries = farmState.log.slice(-40);
        const res = await fetch('/api/stardew/commit', {

          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entries, dayLabel: farmState.lastDay, port: farmState.port })
        });
        const data = await res.json().catch(() => ({}));
        if (data.ok) {

          farmSaveState();
          renderFarmLab();
        } else if (!silent) {
          alert('整理失败：' + (data.error || '未知错误'));

            <div style="font-size:12px;color:#8a83a8;line-height:1.7;">· 游戏需用 SMAPI 启动（StardewModdingAPI.exe），并装好 NagiBridge mod<br>· 开启监控后，浏览器每 10 秒悄悄看一眼游戏（本地直连，不耗 tokens）；只有"大变化"（新一天/进出游戏/换地图/你在游戏里说话）才会让默感知，且 5 分钟现实冷却<br>· 默的农场行动通过工具调用（stardew_state / stardew_action）发生：命令 → 浏览器 → 本地游戏 → 结果回传<br>· 默的耳朵：你在游戏里发的聊天，默能听到，并会在「游戏时刻」里回应你（游戏内聊天或小屋聊天）<br>· 农场动态会按重要度筛选后进记忆海（回忆纪念/游戏），聊天与下次唤醒都能想起<br>· ⚠️ 如果一直"连不上"：这是 Chrome 新安全规则拦了 https 网页连本机。点地址栏左侧的锁图标 → 「本地网络访问」→ 选「允许」，或去 chrome://settings/content/localNetworkAccess 把 mo-home.onrender.com 加入允许，再点测试连接</div>
          </div>`;
        renderFarmLog();
      }
      window.renderFarmLab = renderFarmLab;

      // 每 10 秒轮询一次游戏状态（本地直连，不耗 tokens；是否真的触发由 farmState.monitor 决定）
      setInterval(() => { farmPoll(); }, 10000);

      async function renderAevum() {
        const box = document.getElementById('aevumContent');
        if (!box) return;
        box.innerHTML = '<div class="weather-loading">加载中…</div>';
        try {
          const params = new URLSearchParams();
          if (aevumState.view === 'sea') {
            if (aevumState.filters.status) params.set('status', aevumState.filters.status);
            else params.set('status', 'active');
          }
          if (aevumState.filters.owner) params.set('owner', aevumState.filters.owner);
          if (aevumState.filters.domain) params.set('domain', aevumState.filters.domain);
          if (aevumState.filters.q) params.set('q', aevumState.filters.q);
          const [listRes, statsRes, bookRes, planRes, profRes, moRes, promRes, mozhaRes] = await Promise.all([
            fetch('/api/aevum?' + params.toString()),
            fetch('/api/aevum/stats'),
            fetch('/api/aevum/books').catch(() => null),
            fetch('/api/aevum/plans').catch(() => null),
            fetch('/api/aevum/profile').catch(() => null),
            fetch('/api/aevum/mo-view').catch(() => null),
            fetch('/api/aevum/promises').catch(() => null),
            fetch('/api/aevum/mozha/count').catch(() => null)
          ]);
          let list = (await listRes.json()).memories || [];
          const stats = await statsRes.json();
          const bookData = bookRes && bookRes.ok ? await bookRes.json() : { books: [] };
          const planData = planRes && planRes.ok ? await planRes.json() : { active: [], expired: [] };
          const profData = profRes && profRes.ok ? await profRes.json() : { content: '', dimensions: null, updated_at: null };
          const moData = moRes && moRes.ok ? await moRes.json() : { content: '', updated_at: null };
          const promData = promRes && promRes.ok ? await promRes.json() : { active: [], archived: [] };
          const mozhaCount = mozhaRes && mozhaRes.ok ? ((await mozhaRes.json()).count || 0) : 0;

          const filterSel = (id, options, value, placeholder) => `
            <select id="${id}" onchange="aevumFilter()" style="flex:1;min-width:0;border:1px solid rgba(255,255,255,0.9);border-radius:10px;padding:6px 8px;font-size:13px;background:rgba(255,255,255,0.7);color:#444;outline:none;">
              <option value="">${placeholder}</option>
              ${options.map(([v, l]) => `<option value="${v}" ${value === v ? 'selected' : ''}>${l}</option>`).join('')}
            </select>`;

          const inSea = aevumState.view === 'sea';
          const viewTitle = inSea ? '记忆海 · 事件单元'
            : aevumState.view === 'book' ? '记忆书 · 故事线与计划'
            : '记忆心 · 我眼里的默 / 画像 / 承诺';
          const entryCards = AEVUM_VIEWS.map(([v, l]) => {
            const active = aevumState.view === v;
            let count = '';
            let desc = '';
            if (v === 'sea') count = stats.total || 0;
            else if (v === 'book') count = (bookData.books || []).length;
            if (v === 'sea') desc = '事件单元 · 自动提取，随时回顾';
            else if (v === 'book') desc = '故事线 + 计划';
            else desc = '我眼里的默 / 画像 / 承诺';
            const icon = v === 'sea' ? AEVUM_SEA_ICON : v === 'book' ? AEVUM_BOOK_ICON : AEVUM_HEART_ICON;
            return `<div onclick="aevumSetView('${v}')" style="cursor:pointer;flex:1;min-width:150px;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:5px;${active
              ? 'background:#ffd3de;color:#fff;box-shadow:0 2px 10px rgba(225,120,154,0.25);'
              : 'background:#fff;color:#333;border:1px solid #f0e9f5;'}">
                <span style="font-size:24px;line-height:1;">${icon}</span>
                <span style="font-size:15px;font-weight:600;">${l}${count ? ` <span style="opacity:0.85;font-size:12px;">(${count})</span>` : ''}</span>
                <span style="font-size:11px;${active ? 'color:rgba(255,255,255,0.85);' : 'color:#b0a6c4;'}">${desc}</span>
              </div>`;
          }).join('');

          let html = `
            <div class="feature-card" style="align-items:stretch;gap:8px;">
              <div style="display:flex;gap:10px;flex-wrap:wrap;">${entryCards}</div>
              <div style="font-size:13px;color:#666;font-weight:600;">${viewTitle}</div>
              ${inSea ? `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                ${filterSel('aevumStatus', [['active', '活跃'], ['archived', '已归档']], aevumState.filters.status, '全部状态')}
                ${filterSel('aevumOwner', AEVUM_OWNER_OPTIONS, aevumState.filters.owner, '全部归属')}
                ${filterSel('aevumDomain', AEVUM_DOMAINS_FRONT.map(d => [d, d]), aevumState.filters.domain, '全部领域')}
                <input id="aevumQ" placeholder="搜索内容…" value="${escapeHtml2(aevumState.filters.q)}" oninput="aevumFilter()"
                  style="flex:1;min-width:90px;border:1px solid rgba(255,255,255,0.9);border-radius:10px;padding:6px 10px;font-size:13px;background:rgba(255,255,255,0.7);outline:none;">
                <button onclick="aevumManualExtract()" title="从最近 12 条对话提取事件单元"
                  style="border:1px solid #ffd3de;border-radius:12px;background:#fff;color:#e1789a;padding:8px 12px;font-size:13px;cursor:pointer;">从最近对话提取</button>
                <button onclick="aevumBackfill()" title="给还没有向量的记忆补算向量"
                  style="border:1px solid #ffd3de;border-radius:12px;background:#fff;color:#e1789a;padding:8px 12px;font-size:13px;cursor:pointer;">补算向量</button>
                <button onclick="aevumToggleForm()" style="border:none;border-radius:12px;background:#ffd3de;color:#fff;padding:8px 16px;font-size:13px;cursor:pointer;">${aevumState.showForm || aevumState.editingId ? '收起' : '+ 新增记忆'}</button>
              </div>` : ''}
              ${inSea ? `<div style="font-size:12px;color:#8a83a8;display:flex;gap:12px;flex-wrap:wrap;">
                <span>共 ${stats.total || 0} 条</span>
                <span style="color:#2ecc71;">活跃 ${(stats.byStatus && stats.byStatus.active) || 0}</span>
                <span style="color:#aaa;">已归档 ${(stats.byStatus && stats.byStatus.archived) || 0}</span>
              </div>` : ''}
            </div>
            ${aevumState.view === 'book' ? renderBookPanel(bookData, planData) : ''}
            ${aevumState.view === 'heart' ? renderHeartPanel(moData, profData, promData, mozhaCount) : ''}
            ${inSea && (aevumState.showForm || aevumState.editingId) ? renderAevumForm() : ''}
            ${inSea ? `<div style="display:flex;flex-direction:column;gap:10px;">
              ${list.length ? list.map(m => renderSeaCard(m)).join('')
                : `<div class="feature-card" style="align-items:center;color:#b0a6c4;font-size:14px;">${aevumState.filters.status === 'archived' ? '这里还没有归档的记忆' : '记忆海空空的~默的对话会自动把事件单元存进来'}</div>`}
            </div>` : ''}`;
          box.innerHTML = html;
        } catch (e) {
          box.innerHTML = '<div class="weather-loading">加载失败，请先执行 setup_aevum.sql 并确认后端已部署</div>';
        }
      }

      function promiseRemainDays(iso) {
        const d = Math.max(0, Math.ceil((new Date(iso).getTime() - Date.now()) / 86400000));
        return d;
      }

      function renderPromisePanel(promData) {
        const active = promData.active || [];
        const archived = promData.archived || [];
        return `
          <div class="feature-card" style="align-items:stretch;gap:10px;">
            <div style="font-size:14px;font-weight:600;color:#333;">记下一条承诺</div>
            <div style="font-size:12px;color:#8a83a8;">雪对默许下的承诺，默每次醒来和每次聊天都会固定看到；到期后自动转为一条普通记忆。</div>
            <textarea id="promiseInput" placeholder="例如：会让你慢慢完整起来…" style="width:100%;min-height:70px;border:1px solid #eee;border-radius:12px;padding:8px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;resize:vertical;"></textarea>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <input id="promiseExpires" type="datetime-local" title="留空 = 一直有效" style="flex:1;min-width:150px;border:1px solid #eee;border-radius:10px;padding:6px;font-size:13px;outline:none;">
              <button onclick="aevumAddPromise()" style="border:none;border-radius:12px;background:#ffd3de;color:#fff;padding:8px 18px;font-size:13px;cursor:pointer;">💗 记下承诺</button>
            </div>
            <div style="font-size:11px;color:#b0a6c4;">有效期至：选择具体日期时间；留空表示一直有效。到期后自动转为一条记忆海的普通记忆。</div>
          </div>
          <div class="feature-card" style="align-items:stretch;gap:6px;">
            <div style="font-size:14px;font-weight:600;color:#333;">进行中的承诺（${active.length}）</div>
            ${active.length ? active.map(p => `
              <div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid #f6f2f8;">
                <span style="font-size:20px;">💗</span>
                <div style="flex:1;font-size:13px;color:#444;line-height:1.5;">
                  <div>${escapeHtml2(p.content)}</div>
                  <div style="font-size:11px;color:#b0a6c4;margin-top:2px;">${p.expires_at ? '有效期至 ' + new Date(p.expires_at).toLocaleString('zh-CN', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + '（还有 ' + promiseRemainDays(p.expires_at) + ' 天）' : '一直有效'}</div>
                </div>
                <span style="cursor:pointer;color:#e74c3c;font-size:13px;flex-shrink:0;" onclick="aevumDeletePromise(${p.id})">移除</span>
              </div>`).join('')
              : '<div style="font-size:13px;color:#b0a6c4;padding:6px 0;">还没有承诺，写下第一条吧~</div>'}
          </div>
          ${archived.length ? `
          <div class="feature-card" style="align-items:stretch;gap:6px;">
            <div style="font-size:13px;font-weight:600;color:#8a83a8;">已到期 / 已移除（最近）</div>
            ${archived.slice(0, 5).map(p => `
              <div style="font-size:12px;color:#aaa;padding:4px 0;border-bottom:1px solid #f6f2f8;">${escapeHtml2(p.content)}</div>`).join('')}
          </div>` : ''}`;
      }

      // v3.0 记忆书面板：故事线 + 计划
      function renderBookPanel(bookData, planData) {
        const books = bookData.books || [];
        const plans = planData.active || [];
        const expired = planData.expired || [];
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const todayEnd = new Date(today.getTime() + 86400000);
        const plansCard = `
          <div class="feature-card" style="align-items:stretch;gap:8px;text-align:left;">
            <div style="font-size:14px;font-weight:600;color:#333;">计划</div>
            <div style="font-size:12px;color:#8a83a8;">写下一件要在有效期内做的事，默会记得提醒你。</div>
            <textarea id="planInput" placeholder="例如：周五之前陪我去挑新画架…" style="width:100%;min-height:60px;border:1px solid #eee;border-radius:12px;padding:8px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;resize:vertical;"></textarea>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <input id="planExpires" type="datetime-local" title="留空 = 长期计划" style="flex:1;min-width:150px;border:1px solid #eee;border-radius:10px;padding:6px;font-size:13px;outline:none;">
              <button onclick="aevumAddPlan()" style="border:none;border-radius:12px;background:#ffd3de;color:#fff;padding:8px 18px;font-size:13px;cursor:pointer;">📌 记下计划</button>
            </div>
            <div style="font-size:14px;font-weight:600;color:#333;margin-top:6px;">进行中的计划（${plans.length}）</div>
            ${plans.length ? plans.map(p => {
              let dueText = '长期计划';
              if (p.expires_at) {
                const t = new Date(p.expires_at).getTime();
                dueText = t >= today.getTime() && t < todayEnd.getTime()
                  ? '今天到期 ⏰'
                  : '还有 ' + promiseRemainDays(p.expires_at) + ' 天（' + new Date(p.expires_at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + '）';
              }
              return `
                <div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid #f6f2f8;">
                  <span style="font-size:18px;">📌</span>
                  <div style="flex:1;font-size:13px;color:#444;line-height:1.5;">
                    <div>${escapeHtml2(p.content)}</div>
                    <div style="font-size:11px;color:#b0a6c4;margin-top:2px;">${dueText}</div>
                  </div>
                  <span style="cursor:pointer;color:#e74c3c;font-size:13px;flex-shrink:0;" onclick="aevumDeletePlan(${p.id})">移除</span>
                </div>`;
            }).join('')
            : '<div style="font-size:13px;color:#b0a6c4;padding:6px 0;">还没有计划，写一件想做的事吧~</div>'}
            ${expired.length ? `<div style="font-size:12px;color:#b0a6c4;margin-top:4px;">已到期 ${expired.length} 条（不再提醒，可在下轮清掉）</div>` : ''}
          </div>`;
        const storiesHtml = books.length ? books.map(b => `
            <div class="feature-card" style="align-items:stretch;gap:8px;text-align:left;">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span style="cursor:pointer;font-size:14px;font-weight:600;color:#333;" onclick="aevumToggleBook(${b.id})">${escapeHtml2(aevumViewText(b.label || '（无标签）'))}</span>
                <span style="font-size:11px;color:#8a83a8;">${b.unit_count || 0} 个事件单元</span>
                <span style="margin-left:auto;cursor:pointer;color:#888;font-size:12px;" data-label="${escapeHtml2(b.label || '')}" data-summary="${escapeHtml2(b.summary || '')}" onclick="aevumEditBook(${b.id}, this)">✎ 编辑</span>
              </div>
              <div style="font-size:13px;color:#555;line-height:1.7;">${escapeHtml2(aevumViewText(b.summary))}</div>
              <div id="aevumBookBody_${b.id}" style="display:none;"></div>
            </div>`).join('')
            : '<div class="feature-card" style="align-items:center;color:#b0a6c4;font-size:14px;">记忆书还是空的，点「✨ 生成记忆书」把事件单元串成故事线吧~</div>';
        return `
          <div class="feature-card" style="align-items:stretch;gap:8px;text-align:left;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-size:14px;font-weight:600;color:#333;">记忆书 · 故事线</span>
              <span style="font-size:11px;color:#8a83a8;">把记忆海的事件单元串成完整故事，默回忆时能看到整段经过</span>
              <span style="margin-left:auto;">
                <button data-regen-books onclick="aevumRegenerateBooks()" style="border:1px solid #ffd3de;border-radius:12px;background:#fff;color:#e1789a;padding:8px 14px;font-size:13px;cursor:pointer;" title="清掉现有故事线，用全部事件单元重新整理">♻ 重新整理</button>
                <button data-genbooks onclick="aevumGenerateBooks()" style="border:none;border-radius:12px;background:#ffd3de;color:#fff;padding:8px 14px;font-size:13px;cursor:pointer;">✨ 生成记忆书</button>
              </span>
            </div>
            <div style="font-size:11px;color:#b0a6c4;">点故事线看它包含的事件单元；点事件可看原文。</div>
          </div>
          ${plansCard}
          ${storiesHtml}`;
      }

      // v3.0 记忆心面板：我眼里的默 / 画像 / 承诺 / 默札占位
      function renderHeartPanel(moData, profData, promData, mozhaCount) {
        const mo = String(moData.content || '');
        const moEditing = aevumState.moEditing;
        return `
          <div class="feature-card" style="align-items:stretch;gap:8px;text-align:left;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-size:14px;font-weight:600;color:#333;">我眼里的默</span>
              <span style="font-size:11px;color:#8a83a8;">默对自己的长期认知，每次聊天和唤醒都会固定看到</span>
              <span style="margin-left:auto;display:flex;gap:8px;">
                ${moEditing
                  ? `<button onclick="aevumMoSave()" style="border:none;border-radius:12px;background:#ffd3de;color:#fff;padding:8px 14px;font-size:13px;cursor:pointer;">保存</button>
                     <button onclick="aevumMoCancelEdit()" style="border:1px solid #ddd;border-radius:12px;background:#fff;color:#888;padding:8px 14px;font-size:13px;cursor:pointer;">取消</button>`
                  : `<button onclick="aevumMoGenerate()" style="border:1px solid #ffd3de;border-radius:12px;background:#fff;color:#e1789a;padding:8px 14px;font-size:13px;cursor:pointer;">✨ AI 生成</button>
                     ${mo ? `<button onclick="aevumMoEdit()" style="border:none;border-radius:12px;background:#ffd3de;color:#fff;padding:8px 14px;font-size:13px;cursor:pointer;">✎ 编辑</button>` : ''}`}
              </span>
            </div>
            ${moEditing
              ? `<textarea id="aevumMoContent" style="width:100%;min-height:120px;border:1px solid #eee;border-radius:10px;padding:8px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;">${escapeHtml2(mo)}</textarea>`
        : (mo ? `<div style="font-size:13px;color:#555;line-height:1.8;white-space:pre-wrap;">${escapeHtml2(aevumViewText(mo))}</div>` : '<div style="font-size:13px;color:#b0a6c4;">还没有内容，点「✨ AI 生成」根据默的行为记录归纳~</div>')}
            ${moData.updated_at ? `<div style="font-size:11px;color:#b0a6c4;">上次更新：${new Date(moData.updated_at).toLocaleString('zh-CN', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>` : ''}
          </div>
          ${renderProfilePanel(profData, [])}
          ${renderPromisePanel(promData)}
          <div class="feature-card" style="align-items:center;gap:6px;">
            <div style="font-size:13px;color:#8a83a8;">📓 默札 · ${mozhaCount} 篇（仅默可见，他不主动翻开时谁也看不到）</div>
          </div>`;
      }

      function renderTopicPanel(topicData) {
        const topics = topicData.topics || [];
        return `
          <div class="feature-card" style="align-items:stretch;gap:8px;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-size:14px;font-weight:600;color:#333;">记忆书</span>
              <span style="font-size:12px;color:#8a83a8;">把散落的事件块整理成故事线，默回忆时能看到整段经过</span>
              <span style="margin-left:auto;">
                <button data-regen-topics onclick="aevumRegenerateTopics()" style="border:1px solid #ffd3de;border-radius:12px;background:#fff;color:#e1789a;padding:8px 14px;font-size:13px;cursor:pointer;" title="清掉现有记忆书，用全部事件块（含记忆）重新整理">♻ 重新整理</button>
                <button data-gentopics onclick="aevumGenerateTopics()" style="border:none;border-radius:12px;background:#ffd3de;color:#fff;padding:8px 14px;font-size:13px;cursor:pointer;">✨ 生成记忆书</button>
              </span>
            </div>
            <div style="font-size:11px;color:#b0a6c4;">点故事线看事件，点事件看记忆和原文。每个事件块里的记忆（含关系/意义/人格）都会参与整理。</div>
          </div>
          ${topics.length ? topics.map(t => `
            <div class="feature-card" style="align-items:stretch;gap:8px;">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span data-title="${escapeHtml2(t.title)}" style="cursor:pointer;font-size:14px;font-weight:600;color:#333;" onclick="aevumToggleTopic(${t.id})">${escapeHtml2(t.title)}</span>
                <span style="font-size:11px;color:#8a83a8;">${t.episode_count || 0} 段 · ${t.memory_count || 0} 条记忆</span>

      function renderSeaCard(m) {
        const statusBg = m.status === 'active' ? '#e8f9f0' : m.status === 'archived' ? '#f0f0f0' : '#fff3d6';
        const statusColor = m.status === 'active' ? '#2ecc71' : m.status === 'archived' ? '#aaa' : '#b8860b';
        const when = m.event_time || m.created_at;
        const ev = (m.evidence && m.evidence.length)
          ? m.evidence.map(s => String(s || '').trim()).filter(Boolean).join('\n')
          : '';
        const fullCtx = m.context || ev;
        return `
          <div class="feature-card" style="align-items:stretch;text-align:left;gap:8px;">
            ${when ? `<div style="font-size:12px;color:#8a5fb5;font-weight:600;">🕐 ${new Date(when).toLocaleString('zh-CN', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>` : ''}
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-size:14px;font-weight:600;color:#333;">${escapeHtml2(aevumViewText(m.title || '（无标题）'))}</span>
              ${m.occurrence > 1 ? `<span title="这件事反复出现过" style="font-size:11px;padding:2px 8px;border-radius:10px;background:#fdf3e7;color:#c0846b;">x${m.occurrence}</span>` : ''}
              <span style="font-size:12px;color:#8a83a8;">${AEVUM_OWNER_LABELS[m.owner] || m.owner}</span>
              <span style="font-size:11px;padding:2px 8px;border-radius:10px;background:${statusBg};color:${statusColor};">${AEVUM_STATUS_LABELS[m.status] || m.status}</span>
            </div>
            ${fullCtx ? `<div style="font-size:12px;color:#666;background:#faf7fc;border:1px solid #f0e9f5;border-radius:10px;padding:8px;line-height:1.6;white-space:pre-wrap;">📄 原文：${escapeHtml2(aevumViewText(fullCtx))}</div>` : ''}
            <div style="font-size:14px;color:#444;line-height:1.6;white-space:pre-wrap;">${escapeHtml2(aevumViewText(m.content))}</div>
            ${m.tags && m.tags.length ? `<div style="font-size:11px;color:#e1789a;">${m.tags.map(escapeHtml2).join(' · ')}</div>` : ''}
            ${m.domain && m.domain.length ? `<div style="font-size:11px;color:#7f9fd9;">${m.domain.map(escapeHtml2).join(' · ')}</div>` : ''}
            <div style="font-size:11px;color:#aaa;">重要度 ${m.importance ?? 5} · 效价 ${((m.emotion && m.emotion.valence) || 0).toFixed(1)} · 唤醒 ${((m.emotion && m.emotion.arousal) || 0).toFixed(1)}</div>
            <div style="display:flex;gap:10px;justify-content:flex-end;font-size:13px;flex-wrap:wrap;">
              ${m.status === 'archived' || m.status === 'rejected'
                ? `<span style="cursor:pointer;color:#1e90ff;" onclick="aevumReview(${m.id},'approve')">↺ 恢复</span>`
                : `<span style="cursor:pointer;color:#888;" onclick="aevumArchive(${m.id})">归档</span>`}
              <span style="cursor:pointer;color:#c084fc;" onclick="aevumReanalyze(${m.id})">🔄 重新分析</span>
              <span style="cursor:pointer;color:#888;" onclick="aevumEdit(${m.id})">✎ 修改</span>
            </div>
          </div>`;
      }

      function aevumFilter() {
        const g = (id) => document.getElementById(id);
        if (g('aevumType')) aevumState.filters.type = g('aevumType').value;
        if (g('aevumStatus')) aevumState.filters.status = g('aevumStatus').value;
        if (g('aevumOwner')) aevumState.filters.owner = g('aevumOwner').value;
        if (g('aevumDomain')) aevumState.filters.domain = g('aevumDomain').value;
        if (g('aevumQ')) aevumState.filters.q = g('aevumQ').value.trim();
        renderAevum();
      }
      window.aevumFilter = aevumFilter;

      function aevumSetView(view) {
        aevumState.view = view;
        aevumState.filters.status = '';
        aevumState.showForm = false;
        aevumState.editingId = null;
        aevumState.editingData = null;
        aevumState.moEditing = false;
        renderAevum();
      }
      window.aevumSetView = aevumSetView;

      function aevumToggleForm() {
        aevumState.showForm = !aevumState.showForm;
        aevumState.editingId = null;
        aevumState.editingData = null;
        renderAevum();
      }
      window.aevumToggleForm = aevumToggleForm;

      function aevumCancelForm() {
        aevumState.showForm = false;
        aevumState.editingId = null;
        aevumState.editingData = null;
        renderAevum();
      }
      window.aevumCancelForm = aevumCancelForm;

      async function aevumSave() {
        const title = document.getElementById('aevumFormTitle').value.trim();
        const owner = document.getElementById('aevumFormOwner').value;
        const content = document.getElementById('aevumFormContent').value.trim();
        const eventTime = document.getElementById('aevumFormEventTime').value;
        const tags = document.getElementById('aevumFormTags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
        const domains = [...document.querySelectorAll('#aevumFormDomains input:checked')].map(i => i.value);
        const emotion = {
          valence: parseFloat(document.getElementById('aevumFormValence').value),
          arousal: parseFloat(document.getElementById('aevumFormArousal').value)
        };
        const importance = parseInt(document.getElementById('aevumFormImportance').value, 10);
        if (!content) { alert('内容不能为空'); return; }
        const url = aevumState.editingId ? '/api/aevum/' + aevumState.editingId : '/api/aevum';
        const res = await fetch(url, {
          method: aevumState.editingId ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content, owner, domain: domains, emotion, importance, tags, event_time: eventTime || null })
        });
        if (!res.ok) { alert('保存失败，请确认已执行 setup_aevum_v30.sql'); return; }
        aevumState.showForm = false;
        aevumState.editingId = null;
        aevumState.editingData = null;
        renderAevum();
      }
      window.aevumSave = aevumSave;

      // 重新分析：让 AI 根据原文重新生成事件单元
      async function aevumReanalyze(id) {
        if (!confirm('让 AI 根据原文重新分析这条事件单元（会覆盖标题/内容/标签/重要度等），确定吗？')) return;
        try {
          const res = await fetch('/api/aevum/' + id + '/reanalyze', { method: 'POST' });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) { alert(data.error || '重新分析失败，请稍后重试'); return; }
          alert('✅ 已重新分析');
          renderAevum();
        } catch (e) { alert('重新分析失败，请稍后重试'); }
      }
      window.aevumReanalyze = aevumReanalyze;

      // ================== v3.0 记忆书 / 计划 / 我眼里的默 ==================
      async function aevumGenerateBooks() {
        if (!confirm('让 AI 把记忆海的事件单元串成故事线？')) return;
        const btn = document.querySelector('[data-genbooks]');
        const old = btn ? btn.textContent : '';
        if (btn) btn.textContent = '⏳ 生成中…';
        try {
          const res = await fetch('/api/aevum/books/generate', { method: 'POST' });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) { alert(data.error || '生成失败，请确认已执行 setup_aevum_v30.sql'); return; }
          aevumState.topicCache = {};
          if (data.message) alert(data.message);
          else alert('✅ 已生成 ' + (data.created || 0) + ' 段故事线');
          renderAevum();
        } catch (e) { alert('生成失败，请稍后重试'); }
        finally { if (btn) btn.textContent = old; }
      }
      window.aevumGenerateBooks = aevumGenerateBooks;

      async function aevumRegenerateBooks() {
        if (!confirm('会清掉现有记忆书并重新整理（手动改过的摘要会丢失），确定吗？')) return;
        const btn = document.querySelector('[data-regen-books]');
        const old = btn ? btn.textContent : '';
        if (btn) btn.textContent = '⏳ 重新整理中…';
        try {
          const res = await fetch('/api/aevum/books/regenerate', { method: 'POST' });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) { alert(data.error || '重新整理失败，请确认已执行 setup_aevum_v30.sql'); return; }
          aevumState.topicCache = {};
          if (data.message) alert(data.message);
          else alert('✅ 已重新整理 ' + (data.created || 0) + ' 段故事线');
          renderAevum();
        } catch (e) { alert('重新整理失败，请稍后重试'); }
        finally { if (btn) btn.textContent = old; }
      }
      window.aevumRegenerateBooks = aevumRegenerateBooks;

      async function aevumToggleBook(id) {
        const body = document.getElementById('aevumBookBody_' + id);
        if (!body) return;
        if (body.style.display !== 'none') { body.style.display = 'none'; return; }
        if (!aevumState.topicCache['b' + id]) {
          body.innerHTML = '<div style="font-size:12px;color:#b0a6c4;">加载中…</div>';
          try {
            const res = await fetch('/api/aevum/books/' + id);
            const data = await res.json();
            if (!res.ok) throw new Error('bad');
            aevumState.topicCache['b' + id] = data;
          } catch (e) { body.innerHTML = '<div style="font-size:12px;color:#e74c3c;">加载失败</div>'; return; }
        }
        const data = aevumState.topicCache['b' + id];
        const units = data.units || [];
        body.innerHTML = units.length
          ? units.map(m => `
              <div style="font-size:12px;color:#666;margin:4px 0;border-top:1px solid #f6f2f8;padding-top:6px;">
                <span style="color:#8a5fb5;font-weight:600;">${escapeHtml2(aevumViewText(m.title || '（无标题）'))}</span> <span style="color:#b0a6c4;">${new Date(m.event_time || m.created_at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
                <div style="margin-top:2px;">${escapeHtml2(aevumViewText(m.content))}</div>
                <span style="cursor:pointer;color:#b0a6c4;font-size:11px;margin-top:2px;display:inline-block;" onclick="aevumToggleContext(${m.id})">📜 原文</span>
                <span style="cursor:pointer;color:#888;font-size:11px;margin-left:8px;" onclick="aevumEdit(${m.id})">✎ 修改</span>
                <div id="aevumCtx_${m.id}" style="display:none;max-height:160px;overflow:auto;background:#faf7fc;border-radius:8px;padding:6px;margin-top:4px;font-size:11px;"></div>
              </div>`).join('')
          : '<div style="font-size:12px;color:#b0a6c4;">这段故事还没有事件单元</div>';
        body.style.display = 'block';
      }
      window.aevumToggleBook = aevumToggleBook;

      // 记忆书内容编辑：标签 + 摘要都可改（弹窗，textarea 支持长内容）
      function aevumEditBook(id, el) {
        const label = el ? el.dataset.label || '' : '';

        const overlay = document.createElement('div');

              <button onclick="aevumSaveBookEdit(${id})" style="border:none;border-radius:12px;background:#ffd3de;color:#fff;padding:8px 18px;font-size:13px;cursor:pointer;">保存</button>
            </div>
          </div>`;

      window.aevumEditBook = aevumEditBook;

      async function aevumSaveBookEdit(id) {
        const label = document.getElementById('bookEditLabel').value.trim();
        const summary = document.getElementById('bookEditSummary').value.trim();
        if (!summary) { alert('内容不能为空'); return; }
        try {
          const res = await fetch('/api/aevum/books/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ label, summary })

        let date;
        if (isoString) { date = new Date(isoString); if (isNaN(date.getTime())) date = new Date(); }
        else { date = new Date(); }
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        return `${month}-${day} ${hours}:${minutes}:${seconds}`;

        nextBtn.addEventListener('click', e => { e.stopPropagation(); const [cur, tot] = versionText.textContent.split('/').map(Number); if (cur < tot) switchVersion(groupId, cur + 1); });

      function switchVersion(groupId, targetVersion) {
        const userMessages = document.querySelectorAll(`.message.user[data-group-id="${groupId}"]`);
        const assistantMessages = document.querySelectorAll(`.message.assistant[data-group-id="${groupId}"]`);

        // 重新生成场景下用户消息可能只有一个版本：若目标版本没有对应的用户消息，则保留用户消息可见
        const hasUserVersion = [...userMessages].some(msg => msg.dataset.version === String(targetVersion));
        let visibleUserMsg = null;
        userMessages.forEach(msg => {
          const show = hasUserVersion ? msg.dataset.version === String(targetVersion) : true;
          msg.style.display = show ? '' : 'none';
          if (show) visibleUserMsg = msg;
        });

        assistantMessages.forEach(msg => {
          msg.style.display = msg.dataset.assistantVersion === String(targetVersion) ? '' : 'none';
        });

        // 更新导航器版本文字与按钮状态（无论导航器当前挂在哪条消息上）
        const nav = document.querySelector(`.version-nav[data-group-id="${groupId}"]`);
        if (nav) {
          const versionSpan = nav.querySelector('.version-text');
          if (versionSpan) versionSpan.textContent = `${targetVersion}/${nav.dataset.totalVersions}`;
          const prevBtn = nav.querySelector('.prev-btn');
          const nextBtn = nav.querySelector('.next-btn');
          if (prevBtn) prevBtn.style.opacity = targetVersion > 1 ? '1' : '0.4';
          if (nextBtn) nextBtn.style.opacity = targetVersion < parseInt(nav.dataset.totalVersions, 10) ? '1' : '0.4';
          // 把导航器移到当前可见的消息上：优先用户消息，否则跟随可见的助手消息
          if (visibleUserMsg) {
            visibleUserMsg.appendChild(nav);
          } else {
            const visibleAsst = [...assistantMessages].find(m => m.style.display !== 'none');
            if (visibleAsst) visibleAsst.appendChild(nav);
          }
        }
      }

      async function doEditMessage(msgId, newText) {
        const originalUserMsg = messageList.querySelector(`.message.user[data-message-id="${msgId}"]`);
        let originalAssistantMsg = null;
        if (originalUserMsg) {
          originalUserMsg.dataset.groupId = ''; originalUserMsg.dataset.version = '1';
          let next = originalUserMsg.nextElementSibling;
          while (next) {
            if (next.classList.contains('assistant') && !next.dataset.assistantVersion) { originalAssistantMsg = next; originalAssistantMsg.dataset.groupId = ''; originalAssistantMsg.dataset.assistantVersion = '1'; break; }
            next = next.nextElementSibling;
          }
          originalUserMsg.style.display = 'none';
          next = originalUserMsg.nextElementSibling;
          while (next) { if (next.classList.contains('user')) break; next.style.display = 'none'; next = next.nextElementSibling; }
        }
        const tempUserMsg = document.createElement('div'); tempUserMsg.className = 'message user'; tempUserMsg.dataset.tempEdit = 'true';
        const tempBubble = document.createElement('div'); tempBubble.className = 'bubble'; tempBubble.textContent = newText;
        // 编辑带图片的消息时，保留原图片显示
        const origImg = originalUserMsg && originalUserMsg.querySelector('.chat-image');
        if (origImg) tempUserMsg.appendChild(origImg.cloneNode(true));
        const origFileTag = originalUserMsg && originalUserMsg.querySelector('.file-tag');
        if (origFileTag) tempUserMsg.appendChild(origFileTag.cloneNode(true));
        tempUserMsg.appendChild(tempBubble); messageList.appendChild(tempUserMsg); messageList.scrollTop = messageList.scrollHeight;
        showTyping();
        try {
          const response = await fetch('/api/edit-message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messageId: msgId, newContent: newText, city: localStorage.getItem('moWeatherCity') || '', toyManual: toyManualOn(), stardewBrief: farmBrief() }) });
          if (!response.ok) throw new Error('请求失败');
          removeTyping();
          let userMessageId = null, groupId = null, currentVersion = 1, totalVersions = 1, currentAssistantBubble = null, currentThinkingContainer = null, fullReply = '', fullThinking = '';
          let currentMsgDiv = null, currentThinkBody = null, searchPhaseActive = false;
          if (originalUserMsg) originalUserMsg.dataset.groupId = groupId;
          if (originalAssistantMsg) originalAssistantMsg.dataset.groupId = groupId;
          const reader = response.body.getReader(); const decoder = new TextDecoder('utf-8'); let buffer = '';
          const newAssistantMsg = document.createElement('div'); newAssistantMsg.className = 'message assistant';
          const newBubble = document.createElement('div'); newBubble.className = 'bubble'; newAssistantMsg.appendChild(newBubble);
          messageList.appendChild(newAssistantMsg); currentAssistantBubble = newBubble; currentMsgDiv = newAssistantMsg;
          while (true) {
            const { done, value } = await reader.read(); if (done) break;
            buffer += decoder.decode(value, { stream: true }); const lines = buffer.split('\n'); buffer = lines.pop() || '';
            for (const line of lines) {
              const trimmed = line.trim(); if (!trimmed || !trimmed.startsWith('data: ')) continue;
              const payload = trimmed.slice(6);
              try {
                const json = JSON.parse(payload);
                if (json.userMessageId) { userMessageId = json.userMessageId; groupId = json.groupId; currentVersion = json.currentVersion; totalVersions = json.totalVersions; }
                if (json.thinking) {
                  // 去重：只有当收到的新内容不是已记录内容的尾部时才追加
                  if (!fullThinking.endsWith(json.thinking)) {
                    fullThinking += json.thinking;
                  }
                  if (!currentThinkingContainer) {
                    currentThinkingContainer = document.createElement('div');
                    currentThinkingContainer.className = 'thinking-content';
                    currentThinkingContainer.style.display = 'block';
                    newAssistantMsg.insertBefore(currentThinkingContainer, newBubble);
                  }
                  (currentThinkBody || currentThinkingContainer).textContent = fullThinking;
                }
                if (json.searchStart) {
                  // 静默搜索：不新建气泡，把搜索状态行挂进当前思考区，同一气泡里直接回答
                  if (!currentThinkingContainer) {
                    currentThinkingContainer = document.createElement('div');
                    currentThinkingContainer.className = 'thinking-content';
                    currentThinkingContainer.style.display = 'block';
                    currentMsgDiv.insertBefore(currentThinkingContainer, currentAssistantBubble);
                  }
                  const block = setupSearchStatusBlock(currentThinkingContainer);
                  currentThinkBody = block.thinkBody;
                  searchPhaseActive = true;
                  fullReply = ''; fullThinking = '';
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.searchResult) {
                  // 搜索完成：状态行保留，更新为“已搜索到 N 个网页”
                  const statusLine = currentThinkingContainer && currentThinkingContainer.querySelector('.search-status-line');
                  if (statusLine) {
                    statusLine.textContent = '';
                    statusLine.appendChild(createGlobeIcon());
                    statusLine.appendChild(document.createTextNode(json.count > 0 ? ` 已搜索到 ${json.count} 个网页` : ' 联网搜索没有返回结果'));
                  }
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.webRead) {
                  const statusLine = currentThinkingContainer && currentThinkingContainer.querySelector('.search-status-line');
                  if (statusLine) {
                    statusLine.appendChild(document.createTextNode(' 📄 正在查看网页…'));
                  }
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.stardewFlow) {
                  const statusLine = currentThinkingContainer && currentThinkingContainer.querySelector('.search-status-line');
                  if (statusLine) statusLine.textContent = '🌾 ' + json.stardewFlow;
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.toyCmd) { toyExecuteCmd(json.toyCmd); }
                if (json.stardewCmd) {
                  farmHandleCmd(json.stardewCmd);
                }
                if (json.stardewStart) {
                  const m2 = createAssistantStreamMessage();
                  currentMsgDiv = m2.msg; currentThinkingContainer = m2.thinkDiv; currentAssistantBubble = m2.bubble;
                  messageList.appendChild(currentMsgDiv);
                  currentThinkBody = setupFarmStatusLine(currentThinkingContainer);
                  searchPhaseActive = true;
                  fullReply = ''; fullThinking = '';
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.content) { fullReply += stripToyCmdTags(json.content); currentAssistantBubble.textContent = fullReply; }
                if (json.done) {
                  // 收尾：有思考则补上折叠按钮+时间戳，无思考则移除空容器并在气泡上方补时间戳
                  finalizeStreamingMessage(currentMsgDiv, currentThinkingContainer, currentAssistantBubble, !!fullThinking || searchPhaseActive);
                  const oldTemp = document.querySelector('[data-temp-edit="true"]'); if (oldTemp && oldTemp !== tempUserMsg) oldTemp.remove();
                  tempUserMsg.removeAttribute('data-temp-edit');
                  if (originalUserMsg) originalUserMsg.dataset.groupId = groupId;
                  if (originalAssistantMsg) originalAssistantMsg.dataset.groupId = groupId;
                  tempUserMsg.dataset.groupId = groupId; tempUserMsg.dataset.version = currentVersion; tempUserMsg.dataset.messageId = userMessageId;
                  // 只在最终回复上登记分支版本（第一轮的过渡语气泡不参与版本切换）
                  if (json.assistantMessageId) {
                    currentMsgDiv.dataset.groupId = groupId; currentMsgDiv.dataset.assistantVersion = currentVersion;
                    const newBub = tempUserMsg.querySelector('.bubble');
                    addVersionNavigator(groupId, currentVersion, totalVersions, tempUserMsg);
                  }
                }
                if (json.error) throw new Error(json.error);
              } catch (e) { console.warn('解析SSE失败:', e); }
            }
          }
        } catch (err) { console.error('编辑发送失败:', err); document.querySelector('[data-temp-edit="true"]')?.remove(); removeTyping(); alert('发送失败：' + err.message); }
      }

      let historyOldestId = null;
      let historyHasMore = true;
      let historyLoadingMore = false;

      async function loadHistory() {
        try {
          const response = await fetch('/api/history?limit=40'); if (!response.ok) return;
          const data = await response.json();
          if (!data.messages || data.messages.length === 0) { addMessage('assistant', '你好，夫人。我已准备好与你对话。', null, formatTime()); return; }
          const msgs = data.messages;
          historyOldestId = Math.min(...msgs.map(m => m.id));
          historyHasMore = !!data.hasMore;
          const groupMap = new Map();
          msgs.forEach(msg => {
            const role = msg.role === 'user' ? 'user' : 'assistant';
            addMessage(role, msg.content, msg.reasoning_content || null, formatTime(msg.created_at), msg.id, false, msg.image_data || null, msg.file_name || null);
            if (msg.group_id) {
              if (!groupMap.has(msg.group_id)) groupMap.set(msg.group_id, { userMessages: [], assistantMessages: [], maxVersion: 0 });
              const group = groupMap.get(msg.group_id); const el = messageList.lastElementChild;
              if (role === 'user') group.userMessages.push({ element: el, version: msg.version_number || 1, messageId: msg.id });
              else group.assistantMessages.push({ element: el, version: msg.version_number || 1 });
              if (msg.version_number && msg.version_number > group.maxVersion) group.maxVersion = msg.version_number;
            }
          });
          groupMap.forEach((group, groupId) => {
            group.userMessages.forEach(m => { m.element.dataset.groupId = groupId; m.element.dataset.version = m.version; });
            group.assistantMessages.forEach(m => { m.element.dataset.groupId = groupId; m.element.dataset.assistantVersion = m.version; });
            // 同时统计用户与助手消息的版本号，最大版本号即当前版本与总版本数
            const allVersions = [...group.userMessages, ...group.assistantMessages]
              .map(m => m.version)
              .filter(v => v != null);
            if (allVersions.length === 0) return;
            const maxVer = Math.max(...allVersions);
            switchVersion(groupId, maxVer);
            if (maxVer < 2) return; // 只有一个版本时不需要角标
            // 挂载规则：用户消息有多版本时挂在最新用户消息上（编辑场景），否则挂在最新助手消息上（重新生成场景）
            const userVersionCount = new Set(group.userMessages.map(m => m.version)).size;
            let navTarget = null;
            if (userVersionCount > 1) {
              navTarget = (group.userMessages.find(m => m.version === maxVer) || group.userMessages[group.userMessages.length - 1])?.element;
            } else {
              navTarget = (group.assistantMessages.find(m => m.version === maxVer) || group.assistantMessages[group.assistantMessages.length - 1])?.element;
            }
            if (navTarget) {
              addVersionNavigator(groupId, maxVer, maxVer, navTarget);
            }
          });
          const allMsgs = messageList.querySelectorAll('.message.assistant');
          if (allMsgs.length > 0) {
            const last = allMsgs[allMsgs.length - 1];
            if (!last.querySelector('.refresh-btn')) {

      async function loadMoreHistory() {
        if (historyLoadingMore || !historyHasMore || !historyOldestId) return;
        historyLoadingMore = true;
        try {
          const response = await fetch('/api/history?limit=40&before_id=' + historyOldestId);
          if (!response.ok) return;
          const data = await response.json();
          const msgs = data.messages || [];
          if (!msgs.length) { historyHasMore = false; return; }
          const beforeHeight = messageList.scrollHeight;
          const anchor = messageList.firstElementChild;
          msgs.forEach(msg => {
            const role = msg.role === 'user' ? 'user' : 'assistant';
            addMessage(role, msg.content, msg.reasoning_content || null, formatTime(msg.created_at), msg.id, false, msg.image_data || null, msg.file_name || null);
            messageList.insertBefore(messageList.lastElementChild, anchor);
          });
          historyOldestId = Math.min(historyOldestId, ...msgs.map(m => m.id));
          historyHasMore = !!data.hasMore;
          messageList.scrollTop += messageList.scrollHeight - beforeHeight;
        } catch (e) { console.error('加载更早历史失败:', e); }
        finally { historyLoadingMore = false; }

      // ---------- 长按气泡：复制 / 编辑 菜单 ----------
      let bubblePressTimer = null, bubblePressEl = null, bubblePressX = 0, bubblePressY = 0;

        bubblePressEl = null;
      }
      function bubblePressStart(e, pt) {
        const b = e.target && e.target.closest ? e.target.closest('.bubble') : null;
        if (!b) return;

          const el = bubblePressEl; bubblePressEl = null;
          if (el) showBubbleMenu(el, bubblePressX, bubblePressY);
        }, 500);
      }
      function bubblePressMove(pt) {
        if (!bubblePressTimer) return;
        if (Math.abs(pt.clientX - bubblePressX) > 12 || Math.abs(pt.clientY - bubblePressY) > 12) clearBubblePress();
      }
      if (messageList) {
        messageList.addEventListener('touchstart', (e) => { bubblePressStart(e, e.touches[0]); }, { passive: true });
        messageList.addEventListener('touchmove', (e) => { bubblePressMove(e.touches[0]); }, { passive: true });
        messageList.addEventListener('touchend', clearBubblePress);
        messageList.addEventListener('mousedown', (e) => { bubblePressStart(e, e); });
        messageList.addEventListener('mousemove', (e) => { bubblePressMove(e); });

        messageList.addEventListener('mouseleave', clearBubblePress);

      const COPY_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
      const EDIT_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 21h8"/><path d="m15 5 4 4"/><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>';

      function showBubbleMenu(bubble, x, y) {
        const msg = bubble.closest('.message');

        const btnCopy = document.createElement('button');
        btnCopy.style.cssText = 'display:flex;align-items:center;gap:6px;border:none;background:#f7f2fb;color:#8a5fb5;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;';

          btnEdit.style.cssText = 'display:flex;align-items:center;gap:6px;border:none;background:#fdf0f4;color:#e1789a;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;';

        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeBubbleMenu(); });
