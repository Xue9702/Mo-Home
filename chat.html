      window.showBubbleMenu = showBubbleMenu;

      function closeBubbleMenu() {
        const ov = document.getElementById('bubbleMenu');
        if (ov) ov.remove();
      }
      window.closeBubbleMenu = closeBubbleMenu;

      function copyBubbleText(text) {
        closeBubbleMenu();
        const done = () => showPullToast('✅ 已复制');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
        } else {
          fallbackCopy(text, done);
        }
      }
      window.copyBubbleText = copyBubbleText;

      function fallbackCopy(text, done) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          done();
        } catch (e) {
          showPullToast('❌ 复制失败');
        }
      }

      async function sendMessage() {
        const text = userInput.value.trim(); if ((!text && !pendingImage && !pendingFile) || isLoading) return;
        userInput.value = ''; userInput.style.height = 'auto';
        addMessage('user', text, null, formatTime(), null, false, pendingImage || null, pendingFile ? pendingFile.name : null);
        const pendingUserMsg = messageList.lastElementChild;
        const sentImage = pendingImage;
        const sentFile = pendingFile;
        pendingImage = null;
        pendingFile = null;
        imagePreview.style.display = 'none';
        imagePreviewImg.src = '';
        imagePreviewName.textContent = '';

        isLoading = true; sendBtn.disabled = true;

        // 创建流式消息容器
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message assistant';
        msgDiv.id = 'streaming-message';

        // 思考内容容器（默认隐藏，有内容才显示）
        const thinkDiv = document.createElement('div');
        thinkDiv.className = 'thinking-content';
        thinkDiv.style.display = 'none';
        msgDiv.appendChild(thinkDiv);

        // 消息气泡
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        msgDiv.appendChild(bubble);

        messageList.appendChild(msgDiv);
        messageList.scrollTop = messageList.scrollHeight;

        let fullReply = '', fullThinking = '';
        // 当前活跃的流式消息元素（联网搜索时会把“搜索状态 + 正式回答”切到一条新消息上）
        let currentMsgDiv = msgDiv, currentThinkDiv = thinkDiv, currentBubble = bubble, currentThinkBody = null;
        let searchPhaseActive = false;
        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, image: sentImage, file: sentFile, city: localStorage.getItem('moWeatherCity') || '', toyManual: toyManualOn(), stardewBrief: farmBrief() })
          });
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || !trimmed.startsWith('data: ')) continue;
              const payload = trimmed.slice(6);

              try {
                const json = JSON.parse(payload);

                if (json.thinking) {
                  // 去重追加思考内容
                  if (!fullThinking.endsWith(json.thinking)) {
                    fullThinking += json.thinking;
                  }
                  (currentThinkBody || currentThinkDiv).textContent = fullThinking;
                  currentThinkDiv.style.display = 'block'; // 有内容就显示
                  messageList.scrollTop = messageList.scrollHeight;
                }

                if (json.searchStart) {
                  // 静默搜索：不新建气泡，同一气泡里继续（思考→搜索状态→回答）
                  if (!currentMsgDiv || !currentThinkDiv) {
                    const m2 = createAssistantStreamMessage();
                    currentMsgDiv = m2.msg; currentThinkDiv = m2.thinkDiv; currentBubble = m2.bubble;
                    messageList.appendChild(currentMsgDiv);
                  }
                  const block = setupSearchStatusBlock(currentThinkDiv);
                  currentThinkBody = block.thinkBody;
                  searchPhaseActive = true;
                  fullReply = ''; fullThinking = '';
                  messageList.scrollTop = messageList.scrollHeight;
                }

                if (json.mozhaStart) {
                  // 默札翻阅：新建一条消息，状态行显示"正在翻开默札…"，随后接续正文
                  const m2 = createAssistantStreamMessage();
                  currentMsgDiv = m2.msg; currentThinkDiv = m2.thinkDiv; currentBubble = m2.bubble;
                  messageList.appendChild(currentMsgDiv);
                  const block = setupSearchStatusBlock(currentThinkDiv);
                  const statusLine = currentThinkDiv.querySelector('.search-status-line');
                  if (statusLine) {
                    statusLine.innerHTML = '';
                    statusLine.appendChild(document.createTextNode('📓 正在翻开默札…'));
                  }
                  currentThinkBody = block.thinkBody;
                  searchPhaseActive = true;
                  fullReply = ''; fullThinking = '';
                  messageList.scrollTop = messageList.scrollHeight;
                }

                if (json.searchResult) {
                  // 搜索完成：状态行保留，更新为“已搜索到 N 个网页”
                  const statusLine = currentThinkDiv.querySelector('.search-status-line');
                  if (statusLine) {
                    statusLine.textContent = '';
                    statusLine.appendChild(createGlobeIcon());
                    statusLine.appendChild(document.createTextNode(json.count > 0 ? ` 已搜索到 ${json.count} 个网页` : ' 联网搜索没有返回结果'));
                  }
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.webRead) {
                  const statusLine = currentThinkDiv.querySelector('.search-status-line');
                  if (statusLine) {
                    statusLine.appendChild(document.createTextNode(' 📄 正在查看网页…'));
                  }
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.stardewFlow) {
                  const statusLine = currentThinkDiv.querySelector('.search-status-line');
                  if (statusLine) statusLine.textContent = '🌾 ' + json.stardewFlow;
                  messageList.scrollTop = messageList.scrollHeight;
                }

                if (json.toyCmd) {
                  toyExecuteCmd(json.toyCmd);
                }
                if (json.stardewCmd) {
                  farmHandleCmd(json.stardewCmd);
                }
                if (json.stardewStart) {
                  const m2 = createAssistantStreamMessage();
                  currentMsgDiv = m2.msg; currentThinkDiv = m2.thinkDiv; currentBubble = m2.bubble;
                  messageList.appendChild(currentMsgDiv);
                  currentThinkBody = setupFarmStatusLine(currentThinkDiv);
                  searchPhaseActive = true;
                  fullReply = ''; fullThinking = '';
                  messageList.scrollTop = messageList.scrollHeight;
                }

                if (json.content) {
                  fullReply += stripToyCmdTags(json.content);
                  currentBubble.textContent = fullReply;
                  messageList.scrollTop = messageList.scrollHeight;
                }

                if (json.done) {
                  // 1. 收尾：有思考则补上折叠按钮+时间戳，无思考则移除空容器并在气泡上方补时间戳
                  finalizeStreamingMessage(currentMsgDiv, currentThinkDiv, currentBubble, !!fullThinking || searchPhaseActive);

                  // 2. 将当前消息从流式容器转换为最终消息
                  currentMsgDiv.id = '';
                  if (json.assistantMessageId) {
                    currentMsgDiv.dataset.messageId = json.assistantMessageId;
                  }

                  // 2.5 为新生成的助手消息补上刷新（重新生成）按钮
                  if (json.assistantMessageId && !currentMsgDiv.querySelector('.refresh-btn')) {
                    const refreshBtn = document.createElement('span');
                    refreshBtn.className = 'refresh-btn';
                    refreshBtn.appendChild(createRefreshIcon());
                    refreshBtn.title = '重新生成';
                    refreshBtn.dataset.messageId = json.assistantMessageId;
                    refreshBtn.addEventListener('click', e => { e.stopPropagation(); handleRegenerate(refreshBtn, currentMsgDiv); });
                    currentMsgDiv.appendChild(refreshBtn);
                  }

                  // 3. 为新发送的用户消息补上 msgId 和长按编辑事件
                  if (pendingUserMsg && json.userMessageId) {
                    pendingUserMsg.dataset.messageId = json.userMessageId;
                  }

                  // 4. 清理上一个助手消息的刷新按钮
                  const allAsst = messageList.querySelectorAll('.message.assistant');
                  if (allAsst.length > 1) {
                    const prev = allAsst[allAsst.length - 2];
                    const oldBtn = prev.querySelector('.refresh-btn');
                    if (oldBtn) oldBtn.remove();
                  }
                }

                if (json.error) throw new Error(json.error);
              } catch (e) { /* ignore */ }
            }
          }
        } catch (err) {
          console.error('发送消息失败:', err);
          currentBubble.textContent = '❌ 请求失败：' + err.message;
        } finally {
          isLoading = false;
          sendBtn.disabled = false;
          userInput.focus();
        }
      }

      async function handleRegenerate(btn, msgDiv) {
        // 只有重新生成“非最新”回复（会折叠之后的对话）时才需要确认；刷新最新一条直接执行
        const allAsstMsgs = messageList.querySelectorAll('.message.assistant');
        const isLatest = allAsstMsgs.length > 0 && msgDiv === allAsstMsgs[allAsstMsgs.length - 1];
        if (!isLatest && !confirm('重新生成会从这里开启新分支，这条回复之后的消息会被折叠隐藏（可通过版本角标切回查看）。确定要重新生成吗？')) return;
        if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳ 生成中...';
        const messageId = btn.dataset.messageId;
        if (!messageId || messageId.startsWith('temp-')) { btn.textContent = '❌ 无效消息'; setTimeout(() => { btn.textContent = ''; btn.appendChild(createRefreshIcon()); btn.title = '重新生成'; btn.disabled = false; }, 2000); return; }
        let newMsgDiv = null;
        let fullReply = '', fullThinking = '', streamError = null;
        let currentMsgDiv = null, currentThinkDiv = null, currentBubble = null, currentThinkBody = null;
        let searchPhaseActive = false;
        try {
          // 隐藏旧回复（保留在 DOM 中供角标切换），创建新的助手消息元素
          msgDiv.style.display = 'none';

          newMsgDiv = document.createElement('div');
          newMsgDiv.className = 'message assistant';
          newMsgDiv.id = 'streaming-message';

          const thinkDiv = document.createElement('div');
          thinkDiv.className = 'thinking-content';
          thinkDiv.style.display = 'none';
          newMsgDiv.appendChild(thinkDiv);

          const bubble = document.createElement('div');
          bubble.className = 'bubble';
          newMsgDiv.appendChild(bubble);

          msgDiv.parentNode.insertBefore(newMsgDiv, msgDiv.nextSibling);
          messageList.scrollTop = messageList.scrollHeight;

          fullReply = ''; fullThinking = ''; streamError = null;
          // 当前活跃的流式消息元素（联网搜索时会切到一条新消息）
          currentMsgDiv = newMsgDiv; currentThinkDiv = thinkDiv; currentBubble = bubble; currentThinkBody = null;
          searchPhaseActive = false;
          let doneInfo = null;
          const response = await fetch('/api/regenerate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messageId, city: localStorage.getItem('moWeatherCity') || '', toyManual: toyManualOn(), stardewBrief: farmBrief() }) });
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const reader = response.body.getReader(); const decoder = new TextDecoder('utf-8'); let buffer = '';
          while (true) {
            const { done, value } = await reader.read(); if (done) break;
            buffer += decoder.decode(value, { stream: true }); const lines = buffer.split('\n'); buffer = lines.pop() || '';
            for (const line of lines) {
              const trimmed = line.trim(); if (!trimmed || !trimmed.startsWith('data: ')) continue;
              const payload = trimmed.slice(6);
              try {
                const json = JSON.parse(payload);
                if (json.thinking) {
                  // 去重：只有当收到的新内容不是已记录内容的尾部时才追加
                  if (!fullThinking.endsWith(json.thinking)) {
                    fullThinking += json.thinking;
                  }
                  currentThinkDiv.style.display = 'block';
                  (currentThinkBody || currentThinkDiv).textContent = fullThinking;
                }
                if (json.searchStart) {
                  // 静默搜索：不新建气泡，同一气泡里继续（思考→搜索状态→回答）
                  const block = setupSearchStatusBlock(currentThinkDiv);
                  currentThinkBody = block.thinkBody;
                  searchPhaseActive = true;
                  fullReply = ''; fullThinking = '';
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.searchResult) {
                  // 搜索完成：状态行保留，更新为“已搜索到 N 个网页”
                  const statusLine = currentThinkDiv.querySelector('.search-status-line');
                  if (statusLine) {
                    statusLine.textContent = '';
                    statusLine.appendChild(createGlobeIcon());
                    statusLine.appendChild(document.createTextNode(json.count > 0 ? ` 已搜索到 ${json.count} 个网页` : ' 联网搜索没有返回结果'));
                  }
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.webRead) {
                  const statusLine = currentThinkDiv.querySelector('.search-status-line');
                  if (statusLine) {
                    statusLine.appendChild(document.createTextNode(' 📄 正在查看网页…'));
                  }
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.stardewFlow) {
                  const statusLine = currentThinkDiv.querySelector('.search-status-line');
                  if (statusLine) statusLine.textContent = '🌾 ' + json.stardewFlow;
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.toyCmd) { toyExecuteCmd(json.toyCmd); }
                if (json.stardewCmd) {
                  farmHandleCmd(json.stardewCmd);
                }
                if (json.stardewStart) {
                  const m2 = createAssistantStreamMessage();
                  currentMsgDiv = m2.msg; currentThinkDiv = m2.thinkDiv; currentBubble = m2.bubble;
                  messageList.insertBefore(currentMsgDiv, newMsgDiv.nextSibling);
                  currentThinkBody = setupFarmStatusLine(currentThinkDiv);
                  searchPhaseActive = true;
                  fullReply = ''; fullThinking = '';
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.content) { fullReply += stripToyCmdTags(json.content); currentBubble.textContent = fullReply; }
                if (json.done && !json.assistantMessageId) {
                  // 第一轮消息完成（过渡语气泡）：收尾补上折叠按钮+时间戳
                  finalizeStreamingMessage(currentMsgDiv, currentThinkDiv, currentBubble, !!fullThinking);
                  currentMsgDiv.id = '';
                }
                if (json.assistantMessageId && json.groupId) doneInfo = json;
                if (json.error) { streamError = json.error; throw new Error(json.error); }
              } catch (e) { console.warn('解析SSE失败:', e, payload); }
            }
          }
          if (streamError) throw new Error(streamError);
          if (!doneInfo || !fullReply) throw new Error('未收到有效回复');

          currentMsgDiv.id = '';
          currentMsgDiv.dataset.messageId = doneInfo.assistantMessageId;
          currentMsgDiv.dataset.groupId = doneInfo.groupId;
          currentMsgDiv.dataset.assistantVersion = String(doneInfo.currentVersion);

          // 旧回复打上分支组标记（默认隐藏，角标可切回）
          msgDiv.dataset.groupId = doneInfo.groupId;
          msgDiv.dataset.assistantVersion = String(doneInfo.oldVersion || 1);

          // 恢复旧回复上刷新按钮的图标（旧消息被隐藏，切回时仍可正常使用）
          btn.textContent = '';
          btn.appendChild(createRefreshIcon());
          btn.title = '重新生成';
          btn.disabled = false;

          // 收尾：有思考则补上折叠按钮+时间戳，无思考则移除空容器并在气泡上方补时间戳
          finalizeStreamingMessage(currentMsgDiv, currentThinkDiv, currentBubble, !!fullThinking || searchPhaseActive);

          // 给新回复补上刷新按钮
          if (!currentMsgDiv.querySelector('.refresh-btn')) {
            const refreshBtn = document.createElement('span');
            refreshBtn.className = 'refresh-btn';
            refreshBtn.appendChild(createRefreshIcon());
            refreshBtn.title = '重新生成';
            refreshBtn.dataset.messageId = doneInfo.assistantMessageId;
            refreshBtn.addEventListener('click', e => { e.stopPropagation(); handleRegenerate(refreshBtn, currentMsgDiv); });
            currentMsgDiv.appendChild(refreshBtn);
          }

          // 只显示最新版本，并挂上版本角标（多个版本时）
          switchVersion(doneInfo.groupId, doneInfo.currentVersion);
          if (doneInfo.totalVersions > 1) {
            // 挂载规则：组内用户消息有多版本时挂在最新用户消息上（编辑场景），否则挂在助手消息上（重新生成场景）
            let navTarget = currentMsgDiv;
            const groupUserMsgs = document.querySelectorAll(`.message.user[data-group-id="${doneInfo.groupId}"]`);
            const userVersionCount = new Set([...groupUserMsgs].map(m => m.dataset.version)).size;
            if (userVersionCount > 1) {
              const latestUser = [...groupUserMsgs].find(m => m.dataset.version === String(doneInfo.currentVersion));
              if (latestUser) navTarget = latestUser;
            }
            addVersionNavigator(doneInfo.groupId, doneInfo.currentVersion, doneInfo.totalVersions, navTarget);
          }
          messageList.scrollTop = messageList.scrollHeight;
        } catch (err) {
          console.error('重新生成失败:', err);
          msgDiv.style.display = '';
          // 有部分内容时保留现场并提示，而不是让消息直接消失
          let kept = null;
          if (currentMsgDiv && currentMsgDiv.parentNode && currentBubble && currentBubble.textContent.trim()) {
            currentMsgDiv.id = '';
            currentBubble.textContent += '\n⚠️ 生成中断，请点重试';
            finalizeStreamingMessage(currentMsgDiv, currentThinkDiv, currentBubble, !!fullThinking);
            kept = currentMsgDiv;
          }
          if (!kept) {
            if (newMsgDiv && newMsgDiv.parentNode) newMsgDiv.remove();
            if (currentMsgDiv && currentMsgDiv.parentNode && currentMsgDiv !== newMsgDiv) currentMsgDiv.remove();
          }
          btn.textContent = '❌ 失败，点击重试'; btn.disabled = false;
          setTimeout(() => { btn.textContent = ''; btn.appendChild(createRefreshIcon()); btn.title = '重新生成'; }, 3000);
        }
      }

      // ---------- 浏览器通知 ----------
      async function enableNotifications() {
        const statusEl = document.getElementById('notifyStatus');
        if (!('Notification' in window)) {
          if (statusEl) statusEl.textContent = '❌ 浏览器不支持';
          return;
        }
        if (Notification.permission === 'granted') {
          if (statusEl) statusEl.textContent = '✅ 已开启';
          return;
        }
        try {
          const result = await Notification.requestPermission();
          if (statusEl) statusEl.textContent = result === 'granted' ? '✅ 已开启' : '未授权';
        } catch (e) {
          if (statusEl) statusEl.textContent = '❌ 授权失败';
        }
      }
      window.enableNotifications = enableNotifications;

      // 轮询未读通知并弹出浏览器通知（25 秒一次）
      async function pollNotifications() {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        try {
          const res = await fetch('/api/notifications');
          const data = await res.json();
          const items = data.items || [];
          if (!items.length) return;
          for (const item of items) {
            try {
              new Notification(item.title || '默', { body: item.body || '', tag: 'mo-' + item.id, icon: '/icon-192.png' });
            } catch (e) { /* 单条失败不影响 */ }
          }
          await fetch('/api/notifications/read', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids: items.map(i => i.id) })
          });
        } catch (e) { /* 轮询失败静默 */ }
      }

      // ============ 测试窗口（?mode=test）============
      function openTestPersonaEditor() {
        const modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:flex;align-items:center;justify-content:center;';
        const box = document.createElement('div');
        box.style.cssText = 'background:#fff;border-radius:16px;padding:18px;width:min(92vw,720px);max-height:88vh;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;';
        const title = document.createElement('div');
        title.style.cssText = 'font-size:15px;font-weight:600;color:#333;';
        title.textContent = '🧪 测试窗口人设（与默完全隔离，仅本浏览器生效）';
        const ta = document.createElement('textarea');
        ta.value = localStorage.getItem('moTestPersona') || '';
        ta.style.cssText = 'width:100%;min-height:300px;flex:1;font-family:inherit;font-size:13px;padding:12px;border:1px solid #e9e9e9;border-radius:12px;outline:none;resize:vertical;box-sizing:border-box;';
        const tip = document.createElement('div');
        tip.style.cssText = 'font-size:12px;color:#999;line-height:1.6;';
        tip.textContent = '提示：测试窗只使用「你填的人设 + 本窗10轮历史」，不会读取任何记忆/天气/工具，与默完全隔离。先点「复制默当前人设」拿到生产人设再改，也可以清空重写；保存后立刻对后续消息生效。';
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:10px;justify-content:flex-end;align-items:center;';
        const copyBtn = document.createElement('button');
        copyBtn.textContent = '📋 复制默当前人设';
        copyBtn.style.cssText = 'padding:8px 14px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-size:13px;';
        copyBtn.onclick = async () => {
          copyBtn.disabled = true; copyBtn.textContent = '读取中…';
          try {
            const r = await fetch('/api/test/persona');
            const j = await r.json();
            if (j.ok && j.persona) { ta.value = j.persona; copyBtn.textContent = '✓ 已填入，可编辑'; }
            else copyBtn.textContent = '读取失败';
          } catch (e) { copyBtn.textContent = '读取失败'; }
          setTimeout(() => { copyBtn.disabled = false; copyBtn.textContent = '📋 复制默当前人设'; }, 1500);
        };
        const cancelBtn = document.createElement('button');
        cancelBtn.textContent = '取消';
        cancelBtn.style.cssText = 'padding:8px 16px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-size:13px;';
        cancelBtn.onclick = () => modal.remove();
        const saveBtn = document.createElement('button');
        saveBtn.textContent = '保存';
        saveBtn.style.cssText = 'padding:8px 20px;border:none;border-radius:20px;background:#1e90ff;color:#fff;cursor:pointer;font-size:13px;';
        saveBtn.onclick = () => {
          localStorage.setItem('moTestPersona', ta.value.trim());
          modal.remove();
          const pb = document.getElementById('testPersonaBtn');
          if (pb) { const old = pb.textContent; pb.textContent = '✓ 已保存'; setTimeout(() => { pb.textContent = old; }, 1500); }
        };
        row.appendChild(copyBtn); row.appendChild(cancelBtn); row.appendChild(saveBtn);
        box.appendChild(title); box.appendChild(ta); box.appendChild(tip); box.appendChild(row);
        modal.appendChild(box);
        document.body.appendChild(modal);
      }
      window.openTestPersonaEditor = openTestPersonaEditor;

      function addTestWindowNote() {
        const note = document.createElement('div');
        note.style.cssText = 'font-size:11px;color:#a89ac8;text-align:center;padding:6px 10px;line-height:1.5;';
        note.textContent = '🧪 测试窗口：只使用你填的人设 + 本窗10轮历史（无记忆 / 天气 / 工具）';
        messageList.appendChild(note);
      }

      async function loadTestHistory() {
        try {
          const r = await fetch('/api/test/history');
          const j = await r.json();
          if (!j.ok) return;
          addTestWindowNote();
          for (const m of (j.messages || [])) {
            if (m.role === 'user' || m.role === 'assistant') {
              addMessage(m.role === 'user' ? 'user' : 'assistant', String(m.content || ''), m.reasoning_content || null, m.created_at || null);
            }
          }
        } catch (e) { /* 忽略 */ }
      }

      async function sendTestMessage() {
        const text = userInput.value.trim();
        if (!text || isLoading) return;
        const persona = localStorage.getItem('moTestPersona') || '';
        if (!persona) {
          openTestPersonaEditor();
          return;
        }
        isLoading = true;
        sendBtn.disabled = true;
        userInput.value = '';
        userInput.style.height = 'auto';
        addMessage('user', text);
        const m2 = createAssistantStreamMessage();
        messageList.appendChild(m2.msg);
        m2.thinkDiv.style.display = 'block';
        let fullReply = '', fullThinking = '';
        try {
          const response = await fetch('/api/test/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: text, persona })
          });
          if (!response.ok || !response.body) {
            m2.bubble.textContent = '请求失败，请重试';
            return;
          }
          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';
            for (const line of lines) {
              const t = line.trim();
              if (!t || !t.startsWith('data: ')) continue;
              let json = null;
              try { json = JSON.parse(t.slice(6)); } catch (e) { continue; }
              if (json.error) m2.bubble.textContent = '⚠️ ' + json.error;
              if (json.thinking) {
                if (!fullThinking.endsWith(json.thinking)) fullThinking += json.thinking;
                m2.thinkDiv.textContent = fullThinking;
              }
              if (json.content) {
                fullReply += json.content;
                m2.bubble.textContent = fullReply;
              }
            }
            messageList.scrollTop = messageList.scrollHeight;
          }
          if (!fullReply.trim()) m2.msg.remove();
        } catch (e) {
          m2.bubble.textContent = '连接出错：' + ((e && e.message) || e);
        } finally {
          isLoading = false;
          sendBtn.disabled = false;
          messageList.scrollTop = messageList.scrollHeight;
        }
      }
      window.sendTestMessage = sendTestMessage;

      // 标题栏设置图标
      if (headerSettingsBtn && !headerSettingsBtn.hasChildNodes()) {
        headerSettingsBtn.appendChild(createMenuIcon());
      }

      unlockBtn.addEventListener('click', () => {
        if (passwordInput.value.trim() === CORRECT_PASSWORD) { loginBox.style.display = 'none'; chatApp.style.display = 'flex'; if (TEST_MODE) loadTestHistory(); else loadHistory(); userInput.focus(); loginError.style.display = 'none'; setInterval(pollNotifications, 25000); setTimeout(() => updateTabIndicator(), 80); }
        else { loginError.style.display = 'block'; passwordInput.value = ''; passwordInput.focus(); }
      });
      passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); unlockBtn.click(); } });
      sendBtn.addEventListener('click', () => { if (TEST_MODE) sendTestMessage(); else sendMessage(); });
      userInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (TEST_MODE) sendTestMessage(); else sendMessage(); } });
      userInput.addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });

      // 压缩大图：手机照片动辄 5-8MB，压缩后再发送给默
      function compressImage(dataUrl, maxSide = 1920, quality = 0.82) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            try {
              let { width, height } = img;
              if (width > maxSide || height > maxSide) {
                const ratio = Math.min(maxSide / width, maxSide / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (e) {
              console.error('图片压缩失败，使用原图:', e);
              resolve(dataUrl);
            }
          };
          img.onerror = () => resolve(dataUrl);
          img.src = dataUrl;
        });
      }

      // 发送按钮：心形图标
      sendBtn.appendChild(createSendIcon());

      // 加号按钮：从底部升起附件弹层
      attachBtn.appendChild(createPlusIcon());
      function openAttachSheet() {
        attachSheet.classList.add('show');
        attachSheetBackdrop.classList.add('show');
      }
      function closeAttachSheet() {
        attachSheet.classList.remove('show');
        attachSheetBackdrop.classList.remove('show');
      }
      attachBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openAttachSheet();
      });
      attachSheetBackdrop.addEventListener('click', closeAttachSheet);
      attachSheet.querySelectorAll('.attach-sheet-item').forEach(item => {
        item.addEventListener('click', () => {
          closeAttachSheet();
          if (item.dataset.kind === 'image') imageInput.click();
          else fileInput.click();
        });
      });

      // 图片选择与压缩
      imageInput.addEventListener('change', () => {
        const file = imageInput.files && imageInput.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) { alert('请选择图片文件'); imageInput.value = ''; return; }
        if (file.size > 20 * 1024 * 1024) { alert('图片不能超过 20MB'); imageInput.value = ''; return; }
        const reader = new FileReader();
        reader.onload = async () => {
          let dataUrl = reader.result;
          // 超过 1.5MB 的大图先压缩（手机原图动辄 5-8MB）
          if (file.size > 1.5 * 1024 * 1024) {
            dataUrl = await compressImage(dataUrl);
          }
          pendingImage = dataUrl;
          pendingFile = null;
          imagePreviewImg.src = pendingImage;
          imagePreviewImg.style.display = 'block';
          imagePreviewName.textContent = '';
          imagePreview.style.display = 'flex';
          userInput.focus();
        };
        reader.readAsDataURL(file);
        imageInput.value = '';
      });

      // 文件选择（PDF / Word / 纯文本）
      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        if (file.size > 20 * 1024 * 1024) { alert('文件不能超过 20MB'); fileInput.value = ''; return; }
        const reader = new FileReader();
        reader.onload = () => {
          pendingFile = { name: file.name, type: file.type || '', data: reader.result };
          pendingImage = null;
          imagePreviewImg.src = '';
          imagePreviewImg.style.display = 'none';
          imagePreviewName.textContent = '📄 ' + file.name;
          imagePreview.style.display = 'flex';
          userInput.focus();
        };
        reader.readAsDataURL(file);
        fileInput.value = '';
      });

      // 移除附件
      imagePreviewRemove.addEventListener('click', () => {
        pendingImage = null;
        pendingFile = null;
        imagePreview.style.display = 'none';
        imagePreviewImg.src = '';
        imagePreviewName.textContent = '';
      });

      passwordInput.focus();
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => { });
      console.log('💗 Mo-Home 已加载');
    })();
  </script>
