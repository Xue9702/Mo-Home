      async function loadHistory() {
        try {
          const response = await fetch('/api/history'); if (!response.ok) return;
          const data = await response.json();
          if (!data.messages || data.messages.length === 0) { addMessage('assistant', '你好，夫人。我已准备好与你对话。', null, formatTime()); return; }
          const groupMap = new Map();
          data.messages.forEach(msg => {
            const role = msg.role === 'user' ? 'user' : 'assistant';
            addMessage(role, msg.content, msg.reasoning_content || null, formatTime(msg.created_at), msg.id, false, msg.image_data || null, msg.file_name || null);
            if (msg.group_id) {
              if (!groupMap.has(msg.group_id)) groupMap.set(msg.group_id, { userMessages: [], assistantMessages: [], maxVersion: 0 });
              const group = groupMap.get(msg.group_id); const el = messageList.lastElementChild;
              if (role === 'user') group.userMessages.push({ element: el, version: msg.version_number || 1, messageId: msg.id });
              else group.assistantMessages.push({ element: el, version: msg.version_number || 1 });
              if (msg.version_number && msg.version_number > group.maxVersion) group.maxVersion = msg.version_number;
            }
          });
          groupMap.forEach((group, groupId) => {
            group.userMessages.forEach(m => { m.element.dataset.groupId = groupId; m.element.dataset.version = m.version; });
            group.assistantMessages.forEach(m => { m.element.dataset.groupId = groupId; m.element.dataset.assistantVersion = m.version; });
            // 同时统计用户与助手消息的版本号，最大版本号即当前版本与总版本数
            const allVersions = [...group.userMessages, ...group.assistantMessages]
              .map(m => m.version)
              .filter(v => v != null);
            if (allVersions.length === 0) return;
            const maxVer = Math.max(...allVersions);
            switchVersion(groupId, maxVer);
            if (maxVer < 2) return; // 只有一个版本时不需要角标
            // 挂载规则：用户消息有多版本时挂在最新用户消息上（编辑场景），否则挂在最新助手消息上（重新生成场景）
            const userVersionCount = new Set(group.userMessages.map(m => m.version)).size;
            let navTarget = null;
            if (userVersionCount > 1) {
              navTarget = (group.userMessages.find(m => m.version === maxVer) || group.userMessages[group.userMessages.length - 1])?.element;
            } else {
              navTarget = (group.assistantMessages.find(m => m.version === maxVer) || group.assistantMessages[group.assistantMessages.length - 1])?.element;
            }
            if (navTarget) {
              addVersionNavigator(groupId, maxVer, maxVer, navTarget);
            }
          });
          const allMsgs = messageList.querySelectorAll('.message.assistant');
          if (allMsgs.length > 0) {
            const last = allMsgs[allMsgs.length - 1];
            if (!last.querySelector('.refresh-btn')) {
              const btn = document.createElement('span'); btn.className = 'refresh-btn';
              btn.appendChild(createRefreshIcon()); btn.title = '重新生成';
              btn.dataset.messageId = last.dataset.messageId || 'temp-' + Date.now();
              btn.addEventListener('click', e => { e.stopPropagation(); handleRegenerate(btn, last); });
              last.appendChild(btn);
            }
          }
        } catch (err) { console.error('加载历史失败:', err); addMessage('assistant', '⚠️ 无法加载历史消息，请刷新页面重试。', null, formatTime()); }
      }

      async function sendMessage() {
        const text = userInput.value.trim(); if ((!text && !pendingImage && !pendingFile) || isLoading) return;
        userInput.value = ''; userInput.style.height = 'auto';
        addMessage('user', text, null, formatTime(), null, false, pendingImage || null, pendingFile ? pendingFile.name : null);
        const pendingUserMsg = messageList.lastElementChild;
        const sentImage = pendingImage;
        const sentFile = pendingFile;
        pendingImage = null;
        pendingFile = null;
        imagePreview.style.display = 'none';
        imagePreviewImg.src = '';
        imagePreviewName.textContent = '';

        isLoading = true; sendBtn.disabled = true;

        // 创建流式消息容器
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message assistant';
        msgDiv.id = 'streaming-message';

        // 思考内容容器（默认隐藏，有内容才显示）
        const thinkDiv = document.createElement('div');
        thinkDiv.className = 'thinking-content';
        thinkDiv.style.display = 'none';
        msgDiv.appendChild(thinkDiv);

        // 消息气泡
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        msgDiv.appendChild(bubble);

        messageList.appendChild(msgDiv);
        messageList.scrollTop = messageList.scrollHeight;

        let fullReply = '', fullThinking = '';
        // 当前活跃的流式消息元素（联网搜索时会把“搜索状态 + 正式回答”切到一条新消息上）
        let currentMsgDiv = msgDiv, currentThinkDiv = thinkDiv, currentBubble = bubble, currentThinkBody = null;
        let searchPhaseActive = false;
        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, image: sentImage, file: sentFile, city: localStorage.getItem('moWeatherCity') || '' })
          });
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || !trimmed.startsWith('data: ')) continue;
              const payload = trimmed.slice(6);

              try {
                const json = JSON.parse(payload);

                if (json.thinking) {
                  // 去重追加思考内容
                  if (!fullThinking.endsWith(json.thinking)) {
                    fullThinking += json.thinking;
                  }
                  (currentThinkBody || currentThinkDiv).textContent = fullThinking;
                  currentThinkDiv.style.display = 'block'; // 有内容就显示
                  messageList.scrollTop = messageList.scrollHeight;
                }

                if (json.searchStart) {
                  // 第一轮气泡已收尾：新建一条消息承载“搜索状态 + 第二轮思考 + 正式回答”
                  const m2 = createAssistantStreamMessage();
                  currentMsgDiv = m2.msg; currentThinkDiv = m2.thinkDiv; currentBubble = m2.bubble;
                  messageList.appendChild(currentMsgDiv);
                  const block = setupSearchStatusBlock(currentThinkDiv);
                  currentThinkBody = block.thinkBody;
                  searchPhaseActive = true;
                  fullReply = ''; fullThinking = '';
                  messageList.scrollTop = messageList.scrollHeight;
                }

                if (json.searchResult) {
                  // 搜索完成：状态行保留，更新为“已搜索到 N 个网页”
                  const statusLine = currentThinkDiv.querySelector('.search-status-line');
                  if (statusLine) {
                    statusLine.textContent = '';
                    statusLine.appendChild(createGlobeIcon());
                    statusLine.appendChild(document.createTextNode(json.count > 0 ? ` 已搜索到 ${json.count} 个网页` : ' 联网搜索没有返回结果'));
                  }
                  messageList.scrollTop = messageList.scrollHeight;
                }

                if (json.content) {
                  fullReply += json.content;
                  currentBubble.textContent = fullReply;
                  messageList.scrollTop = messageList.scrollHeight;
                }

                if (json.done) {
                  // 1. 收尾：有思考则补上折叠按钮+时间戳，无思考则移除空容器并在气泡上方补时间戳
                  finalizeStreamingMessage(currentMsgDiv, currentThinkDiv, currentBubble, !!fullThinking || searchPhaseActive);

                  // 2. 将当前消息从流式容器转换为最终消息
                  currentMsgDiv.id = '';
                  if (json.assistantMessageId) {
                    currentMsgDiv.dataset.messageId = json.assistantMessageId;
                  }

                  // 2.5 为新生成的助手消息补上刷新（重新生成）按钮
                  if (json.assistantMessageId && !currentMsgDiv.querySelector('.refresh-btn')) {
                    const refreshBtn = document.createElement('span');
                    refreshBtn.className = 'refresh-btn';
                    refreshBtn.appendChild(createRefreshIcon());
                    refreshBtn.title = '重新生成';
                    refreshBtn.dataset.messageId = json.assistantMessageId;
                    refreshBtn.addEventListener('click', e => { e.stopPropagation(); handleRegenerate(refreshBtn, currentMsgDiv); });
                    currentMsgDiv.appendChild(refreshBtn);
                  }

                  // 3. 为新发送的用户消息补上 msgId 和长按编辑事件
                  if (pendingUserMsg && json.userMessageId) {
                    pendingUserMsg.dataset.messageId = json.userMessageId;
                    const userBubble = pendingUserMsg.querySelector('.bubble');
                    if (userBubble) {
                      let timer;
                      userBubble.addEventListener('touchstart', e => { timer = setTimeout(() => handleEditMessage(json.userMessageId, userBubble.textContent), 600); });
                      userBubble.addEventListener('touchend', () => clearTimeout(timer));
                      userBubble.addEventListener('touchmove', () => clearTimeout(timer));
                      userBubble.addEventListener('mousedown', e => { timer = setTimeout(() => handleEditMessage(json.userMessageId, userBubble.textContent), 600); });
                      userBubble.addEventListener('mouseup', () => clearTimeout(timer));
                      userBubble.addEventListener('mouseleave', () => clearTimeout(timer));
                    }
                  }

                  // 4. 清理上一个助手消息的刷新按钮
                  const allAsst = messageList.querySelectorAll('.message.assistant');
                  if (allAsst.length > 1) {
                    const prev = allAsst[allAsst.length - 2];
                    const oldBtn = prev.querySelector('.refresh-btn');
                    if (oldBtn) oldBtn.remove();
                  }
                }

                if (json.error) throw new Error(json.error);
              } catch (e) { /* ignore */ }
            }
          }
        } catch (err) {
          console.error('发送消息失败:', err);
          currentBubble.textContent = '❌ 请求失败：' + err.message;
        } finally {
          isLoading = false;
          sendBtn.disabled = false;
          userInput.focus();
        }
      }

      async function handleRegenerate(btn, msgDiv) {
        // 防误触：重新生成会从此处开启新分支并折叠之后的对话，先请夫人确认
        if (!confirm('重新生成会从这里开启新分支，这条回复之后的消息会被折叠隐藏（可通过版本角标切回查看）。确定要重新生成吗？')) return;
        if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳ 生成中...';
        const messageId = btn.dataset.messageId;
        if (!messageId || messageId.startsWith('temp-')) { btn.textContent = '❌ 无效消息'; setTimeout(() => { btn.textContent = ''; btn.appendChild(createRefreshIcon()); btn.title = '重新生成'; btn.disabled = false; }, 2000); return; }
        let newMsgDiv = null;
        try {
          // 隐藏旧回复（保留在 DOM 中供角标切换），创建新的助手消息元素
          msgDiv.style.display = 'none';

          newMsgDiv = document.createElement('div');
          newMsgDiv.className = 'message assistant';
          newMsgDiv.id = 'streaming-message';

          const thinkDiv = document.createElement('div');
          thinkDiv.className = 'thinking-content';
          thinkDiv.style.display = 'none';
          newMsgDiv.appendChild(thinkDiv);

          const bubble = document.createElement('div');
          bubble.className = 'bubble';
          newMsgDiv.appendChild(bubble);

          msgDiv.parentNode.insertBefore(newMsgDiv, msgDiv.nextSibling);
          messageList.scrollTop = messageList.scrollHeight;

          let fullReply = '', fullThinking = '', streamError = null;
          // 当前活跃的流式消息元素（联网搜索时会切到一条新消息）
          let currentMsgDiv = newMsgDiv, currentThinkDiv = thinkDiv, currentBubble = bubble, currentThinkBody = null;
          let searchPhaseActive = false;
          let doneInfo = null;
          const response = await fetch('/api/regenerate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messageId, city: localStorage.getItem('moWeatherCity') || '' }) });
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const reader = response.body.getReader(); const decoder = new TextDecoder('utf-8'); let buffer = '';
          while (true) {
            const { done, value } = await reader.read(); if (done) break;
            buffer += decoder.decode(value, { stream: true }); const lines = buffer.split('\n'); buffer = lines.pop() || '';
            for (const line of lines) {
              const trimmed = line.trim(); if (!trimmed || !trimmed.startsWith('data: ')) continue;
              const payload = trimmed.slice(6);
              try {
                const json = JSON.parse(payload);
                if (json.thinking) {
                  // 去重：只有当收到的新内容不是已记录内容的尾部时才追加
                  if (!fullThinking.endsWith(json.thinking)) {
                    fullThinking += json.thinking;
                  }
                  currentThinkDiv.style.display = 'block';
                  (currentThinkBody || currentThinkDiv).textContent = fullThinking;
                }
                if (json.searchStart) {
                  // 第一轮气泡已收尾：新建一条消息承载“搜索状态 + 第二轮思考 + 正式回答”
                  const m2 = createAssistantStreamMessage();
                  currentMsgDiv = m2.msg; currentThinkDiv = m2.thinkDiv; currentBubble = m2.bubble;
                  messageList.insertBefore(currentMsgDiv, newMsgDiv.nextSibling);
                  const block = setupSearchStatusBlock(currentThinkDiv);
                  currentThinkBody = block.thinkBody;
                  searchPhaseActive = true;
                  fullReply = ''; fullThinking = '';
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.searchResult) {
                  // 搜索完成：状态行保留，更新为“已搜索到 N 个网页”
                  const statusLine = currentThinkDiv.querySelector('.search-status-line');
                  if (statusLine) {
                    statusLine.textContent = '';
                    statusLine.appendChild(createGlobeIcon());
                    statusLine.appendChild(document.createTextNode(json.count > 0 ? ` 已搜索到 ${json.count} 个网页` : ' 联网搜索没有返回结果'));
                  }
                  messageList.scrollTop = messageList.scrollHeight;
                }
                if (json.content) { fullReply += json.content; currentBubble.textContent = fullReply; }
                if (json.done && !json.assistantMessageId) {
                  // 第一轮消息完成（过渡语气泡）：收尾补上折叠按钮+时间戳
                  finalizeStreamingMessage(currentMsgDiv, currentThinkDiv, currentBubble, !!fullThinking);
                  currentMsgDiv.id = '';
                }
                if (json.assistantMessageId && json.groupId) doneInfo = json;
                if (json.error) { streamError = json.error; throw new Error(json.error); }
              } catch (e) { console.warn('解析SSE失败:', e, payload); }
            }
          }
          if (streamError) throw new Error(streamError);
          if (!doneInfo || !fullReply) throw new Error('未收到有效回复');

          currentMsgDiv.id = '';
          currentMsgDiv.dataset.messageId = doneInfo.assistantMessageId;
          currentMsgDiv.dataset.groupId = doneInfo.groupId;
          currentMsgDiv.dataset.assistantVersion = String(doneInfo.currentVersion);

          // 旧回复打上分支组标记（默认隐藏，角标可切回）
          msgDiv.dataset.groupId = doneInfo.groupId;
          msgDiv.dataset.assistantVersion = String(doneInfo.oldVersion || 1);

          // 恢复旧回复上刷新按钮的图标（旧消息被隐藏，切回时仍可正常使用）
          btn.textContent = '';
          btn.appendChild(createRefreshIcon());
          btn.title = '重新生成';
          btn.disabled = false;

          // 收尾：有思考则补上折叠按钮+时间戳，无思考则移除空容器并在气泡上方补时间戳
          finalizeStreamingMessage(currentMsgDiv, currentThinkDiv, currentBubble, !!fullThinking || searchPhaseActive);

          // 给新回复补上刷新按钮
          if (!currentMsgDiv.querySelector('.refresh-btn')) {
            const refreshBtn = document.createElement('span');
            refreshBtn.className = 'refresh-btn';
            refreshBtn.appendChild(createRefreshIcon());
            refreshBtn.title = '重新生成';
            refreshBtn.dataset.messageId = doneInfo.assistantMessageId;
            refreshBtn.addEventListener('click', e => { e.stopPropagation(); handleRegenerate(refreshBtn, currentMsgDiv); });
            currentMsgDiv.appendChild(refreshBtn);
          }

          // 只显示最新版本，并挂上版本角标（多个版本时）
          switchVersion(doneInfo.groupId, doneInfo.currentVersion);
          if (doneInfo.totalVersions > 1) {
            // 挂载规则：组内用户消息有多版本时挂在最新用户消息上（编辑场景），否则挂在助手消息上（重新生成场景）
            let navTarget = currentMsgDiv;
            const groupUserMsgs = document.querySelectorAll(`.message.user[data-group-id="${doneInfo.groupId}"]`);
            const userVersionCount = new Set([...groupUserMsgs].map(m => m.dataset.version)).size;
            if (userVersionCount > 1) {
              const latestUser = [...groupUserMsgs].find(m => m.dataset.version === String(doneInfo.currentVersion));
              if (latestUser) navTarget = latestUser;
            }
            addVersionNavigator(doneInfo.groupId, doneInfo.currentVersion, doneInfo.totalVersions, navTarget);
          }
          messageList.scrollTop = messageList.scrollHeight;
        } catch (err) {
          console.error('重新生成失败:', err);
          msgDiv.style.display = '';
          // 有部分内容时保留现场并提示，而不是让消息直接消失
          let kept = null;
          if (currentMsgDiv && currentMsgDiv.parentNode && currentBubble && currentBubble.textContent.trim()) {
            currentMsgDiv.id = '';
            currentBubble.textContent += '\n⚠️ 生成中断，请点重试';
            finalizeStreamingMessage(currentMsgDiv, currentThinkDiv, currentBubble, !!fullThinking);
            kept = currentMsgDiv;
          }
          if (!kept) {
            if (newMsgDiv && newMsgDiv.parentNode) newMsgDiv.remove();
            if (currentMsgDiv && currentMsgDiv.parentNode && currentMsgDiv !== newMsgDiv) currentMsgDiv.remove();
          }
          btn.textContent = '❌ 失败，点击重试'; btn.disabled = false;
          setTimeout(() => { btn.textContent = ''; btn.appendChild(createRefreshIcon()); btn.title = '重新生成'; }, 3000);
        }
      }

      // ---------- 浏览器通知 ----------
      async function enableNotifications() {

        if (!('Notification' in window)) {
          if (statusEl) statusEl.textContent = '❌ 浏览器不支持';
          return;

        if (Notification.permission === 'granted') {

        }

          if (statusEl) statusEl.textContent = result === 'granted' ? '✅ 已开启' : '未授权';
        } catch (e) {
          if (statusEl) statusEl.textContent = '❌ 授权失败';

      }

      // 压缩大图：手机照片动辄 5-8MB，压缩后再发送给默
      function compressImage(dataUrl, maxSide = 1920, quality = 0.82) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            try {
              let { width, height } = img;
              if (width > maxSide || height > maxSide) {
                const ratio = Math.min(maxSide / width, maxSide / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (e) {
              console.error('图片压缩失败，使用原图:', e);
              resolve(dataUrl);
            }
          };
          img.onerror = () => resolve(dataUrl);
          img.src = dataUrl;
        });
      }

      // 图片选择与压缩
      imageInput.addEventListener('change', () => {
        const file = imageInput.files && imageInput.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) { alert('请选择图片文件'); imageInput.value = ''; return; }
        if (file.size > 20 * 1024 * 1024) { alert('图片不能超过 20MB'); imageInput.value = ''; return; }
        const reader = new FileReader();
        reader.onload = async () => {
          let dataUrl = reader.result;
          // 超过 1.5MB 的大图先压缩（手机原图动辄 5-8MB）
          if (file.size > 1.5 * 1024 * 1024) {
            dataUrl = await compressImage(dataUrl);
          }
          pendingImage = dataUrl;
          pendingFile = null;
          imagePreviewImg.src = pendingImage;
          imagePreviewImg.style.display = 'block';
          imagePreviewName.textContent = '';
          imagePreview.style.display = 'flex';
          userInput.focus();
        };
        reader.readAsDataURL(file);
        imageInput.value = '';
      });

      // 文件选择（PDF / Word / 纯文本）
      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        if (file.size > 20 * 1024 * 1024) { alert('文件不能超过 20MB'); fileInput.value = ''; return; }
        const reader = new FileReader();
        reader.onload = () => {
          pendingFile = { name: file.name, type: file.type || '', data: reader.result };
          pendingImage = null;
          imagePreviewImg.src = '';
          imagePreviewImg.style.display = 'none';
          imagePreviewName.textContent = '📄 ' + file.name;
          imagePreview.style.display = 'flex';
          userInput.focus();
        };
        reader.readAsDataURL(file);
        fileInput.value = '';
      });

      // 移除附件
      imagePreviewRemove.addEventListener('click', () => {
        pendingImage = null;
        pendingFile = null;
        imagePreview.style.display = 'none';
        imagePreviewImg.src = '';
        imagePreviewName.textContent = '';
      });

      passwordInput.focus();
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => { });
      console.log('💗 Mo-Home 已加载');
    })();
  </script>
</body>

</html>
