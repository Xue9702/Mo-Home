<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>账本 · Mo-Home</title>
<link rel="stylesheet" href="/fonts/lxgw-wenkai/lxgwwenkai-regular.css">
<style>
  :root {
    --cream: #F4EEE7; --card: #F9F4EC; --blue: #9BB7C8; --blue-deep: #7E9FB3;
    --dark: #3E3E3E; --black: #1F1F1F; --muted: #A49C92; --line: rgba(158,148,135,0.28);
    --income: #9BB7C8; --expense: #E8A87C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "LXGW WenKai", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--cream); color: var(--dark); min-height: 100vh; padding-bottom: 40px; }
  .header { position: sticky; top: 0; z-index: 10; background: rgba(244,238,231,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .back-btn { cursor: pointer; color: var(--blue-deep); font-size: 14px; background: none; border: none; display: inline-flex; align-items: center; gap: 4px; padding: 4px; }
  .month-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0; }
  .month-bar button { background: none; border: 1px solid var(--line); border-radius: 10px; color: var(--blue-deep); padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .month-bar .month-label { font-size: 16px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 12px 16px; }
  .card h2 { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 10px; }
  .summary-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .sum-item { flex: 1; min-width: 90px; text-align: center; padding: 8px 4px; border-radius: 12px; background: rgba(255,255,255,0.55); }
  .sum-item .v { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .sum-item .l { font-size: 11px; color: var(--muted); }
  .sum-item.income .v { color: var(--blue-deep); }
  .sum-item.expense .v { color: #C97A52; }
  .sum-item.net .v { color: var(--dark); }
  .sum-item.budget .v { color: #B08A5A; }
  canvas { width: 100%; display: block; }
  .donut-wrap { position: relative; width: 100%; display: flex; justify-content: center; }
  .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
  .donut-center .n { font-size: 20px; font-weight: 700; }
  .donut-center .t { font-size: 11px; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  select, input { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; background: #fff; color: var(--dark); outline: none; font-family: inherit; }
  .form-row select { flex: 1; min-width: 80px; }
  .form-row input[type=number], .form-row input[type=text] { flex: 1; min-width: 80px; }
  .form-row input[type=date] { flex: 1; min-width: 110px; }
  button.primary { border: none; border-radius: 12px; background: var(--blue); color: var(--cream); padding: 9px 18px; font-size: 14px; cursor: pointer; }
  button.primary:hover { background: var(--blue-deep); }
  .type-toggle { display: flex; gap: 6px; }
  .type-toggle button { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .type-toggle button.on { background: var(--blue); color: var(--cream); border-color: var(--blue); }
  .entry { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .entry:last-child { border-bottom: none; }
  .entry .cat { width: 52px; font-size: 12px; color: var(--blue-deep); flex-shrink: 0; }
  .entry .note { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .note small { display: block; color: var(--muted); font-size: 11px; }
  .entry .amt { font-weight: 600; flex-shrink: 0; }
  .entry .amt.exp { color: #C97A52; }
  .entry .amt.inc { color: var(--blue-deep); }
  .entry .del { cursor: pointer; color: #D98C8C; flex-shrink: 0; font-size: 13px; }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 16px 0; }
  .budget-row { display: flex; gap: 8px; align-items: center; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="history.back()">← 返回</button>
    <h1>📒 账本</h1>
  </div>

  <div class="month-bar">
    <button onclick="shiftMonth(-1)">‹ 上月</button>
    <span class="month-label" id="monthLabel">—</span>
    <button onclick="shiftMonth(1)">下月 ›</button>
  </div>

  <div class="card">
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="budget-row" style="margin-top:10px;">
      <input type="number" id="budgetInput" placeholder="设置本月支出预算（元）" style="flex:1;min-width:0;" min="0" step="0.01">
      <button class="primary" onclick="saveBudget()">保存预算</button>
    </div>
  </div>

  <div class="card">
    <h2>本月支出构成</h2>
    <div class="donut-wrap"><canvas id="donut" width="280" height="280"></canvas><div class="donut-center"><div class="n" id="donutTotal">0</div><div class="t">本月支出</div></div></div>
    <div class="legend" id="donutLegend"></div>
  </div>

  <div class="card">
    <h2>月度对比（本月 vs 上月）</h2>
    <canvas id="compare" width="560" height="220"></canvas>
    <div style="font-size:11px;color:var(--muted);margin-top:4px;"><span style="color:var(--blue-deep);">■</span> 收入 <span style="color:#C97A52;margin-left:10px;">■</span> 支出（柱内差值 = 结余）</div>
  </div>

  <div class="card">
    <h2>记一笔</h2>
    <div class="type-toggle">
      <button id="tExp" class="on" onclick="setType('expense')">支出</button>
      <button id="tInc" onclick="setType('income')">收入（画稿）</button>
    </div>
    <div class="form-row" style="margin-top:10px;">
      <select id="catSel"></select>
      <input type="number" id="amtInput" placeholder="金额（元）" min="0" step="0.01">
    </div>
    <div class="form-row">
      <input type="text" id="noteInput" placeholder="标题（如：草莓厚乳大福）">
      <input type="date" id="dateInput">
    </div>
    <button class="primary" style="width:100%;" onclick="addEntry()">＋ 记下</button>
  </div>

  <div class="card">
    <h2>本月记录</h2>
    <div id="entryList"></div>
  </div>

<script>
  const CATS = ['住房','餐饮','饮品','零食','日用','服饰','订阅','交通','娱乐','关系','健康','学习','其他'];
  let curMonth = new Date().toISOString().slice(0,7);
  let curType = 'expense';
  let summary = null;

  function shiftMonth(d) {
    const [y,m] = curMonth.split('-').map(Number);
    const t = new Date(y, m-1+d, 1);
    curMonth = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0');
    load();
  }
  function setType(t) {
    curType = t;
    document.getElementById('tExp').className = t==='expense' ? 'on' : '';
    document.getElementById('tInc').className = t==='income' ? 'on' : '';
    const cat = document.getElementById('catSel');
    cat.innerHTML = t === 'income'
      ? '<option value="画稿">画稿（收入）</option>'
      : CATS.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  async function load() {
    document.getElementById('monthLabel').textContent = curMonth;
    const r = await fetch('/api/ledger/summary?month=' + curMonth);
    summary = await r.json();
    const m = summary.month || { income:0, expense:0, net:0, byCategory:{} };
    const b = summary.budget;
    const grid = document.getElementById('summaryGrid');
    grid.innerHTML = `
      <div class="sum-item income"><div class="l">本月收入</div><div class="v">¥${(m.income||0).toFixed(2)}</div></div>
      <div class="sum-item expense"><div class="l">本月支出</div><div class="v">¥${(m.expense||0).toFixed(2)}</div></div>
      <div class="sum-item net"><div class="l">结余</div><div class="v">¥${(m.net||0).toFixed(2)}</div></div>
      ${b ? `<div class="sum-item budget"><div class="l">预算剩余</div><div class="v" style="color:${b.remaining < 0 ? '#C0392B' : '#B08A5A'}">¥${b.remaining.toFixed(2)}</div><div class="l" style="color:${b.remaining < 0 ? '#C0392B' : 'inherit'}">${b.remaining < 0 ? '已超支' : '已用 ' + b.ratio + '%'}</div></div>` : ''}`;
    const bd = document.getElementById('budgetInput');
    bd.value = b ? b.expense_budget : '';
    drawDonut(m);
    drawCompare(summary.prevMonth, m);
    renderEntries(summary.entries || []);
  }

  function drawDonut(m) {
    const cv = document.getElementById('donut');
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height, cx = W/2, cy = H/2, R = Math.min(W,H)/2 - 14, r = R - 30;
    ctx.clearRect(0,0,W,H);
    const byCat = m.byCategory || {};
    const entries = Object.entries(byCat).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
    const total = entries.reduce((s,[,v]) => s+v, 0);
    document.getElementById('donutTotal').textContent = '¥' + total.toFixed(2);
    if (!total || !entries.length) {
      ctx.strokeStyle = 'rgba(158,148,135,0.3)'; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
      document.getElementById('donutLegend').innerHTML = '<span style="color:var(--muted);">本月还没有支出</span>';
      return;
    }
    const palette = ['#9BB7C8','#E8A87C','#C9A7B8','#A8C3A0','#D9C08A','#8FA8C9','#C97A52','#7FA8A0','#B8A0C9','#D9A0A0','#98B8D0','#C0A888','#A0B0C0'];
    let ang = -Math.PI/2;
    const segs = entries.map(([c,v],i) => {
      const a2 = ang + (v/total)*Math.PI*2;
      const seg = { c, v, color: palette[i % palette.length], a1: ang, a2 };
      ang = a2;
      return seg;
    });
    for (const s of segs) {
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,s.a1,s.a2); ctx.closePath();
      ctx.fillStyle = s.color; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle = '#F9F4EC'; ctx.fill();
    document.getElementById('donutLegend').innerHTML = segs.map(s =>
      `<span><i style="background:${s.color}"></i>${s.c} ${(s.v/total*100).toFixed(1)}%</span>`).join('');
  }

  function drawCompare(prev, cur) {
    const cv = document.getElementById('compare');
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    const data = [
      { label: '上月', inc: prev?.income||0, exp: prev?.expense||0 },
      { label: '本月', inc: cur?.income||0, exp: cur?.expense||0 }
    ];
    const maxV = Math.max(...data.map(d => Math.max(d.inc, d.exp)), 1);
    const bw = 70, gap = 90, baseY = H - 30, topY = 20;
    const scale = (H - 50) / maxV;
    data.forEach((d, i) => {
      const x = 90 + i * gap;
      const hInc = d.inc * scale, hExp = d.exp * scale;
      const h = Math.max(hInc, hExp);
      const isPos = d.inc >= d.exp;
      // 底部：收入/支出中较小者，其上：差值
      const small = Math.min(hInc, hExp), big = Math.max(hInc, hExp);
      ctx.fillStyle = isPos ? '#9BB7C8' : '#C97A52'; // 底部段颜色 = 较小者的角色
      ctx.fillRect(x - bw/2, baseY - small, bw, small);
      ctx.fillStyle = '#E8A87C'; // 差值段（结余）
      ctx.fillRect(x - bw/2, baseY - big, bw, big - small);
      ctx.strokeStyle = 'rgba(158,148,135,0.3)'; ctx.lineWidth = 1;
      ctx.strokeRect(x - bw/2, baseY - big, bw, big);
      // 标签
      ctx.fillStyle = '#3E3E3E'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(d.label, x, H - 8);
      ctx.font = '11px sans-serif';
      ctx.fillStyle = '#7E9FB3'; ctx.fillText('收 ' + d.inc.toFixed(0), x, baseY - big - 6);
      ctx.fillStyle = '#C97A52'; ctx.fillText('支 ' + d.exp.toFixed(0), x, baseY - big + 14);
      const net = (d.inc - d.exp);
      ctx.fillStyle = net >= 0 ? '#7E9FB3' : '#C0392B';
      ctx.fillText('结余 ' + net.toFixed(0), x, baseY - big + 30);
    });
  }

  function renderEntries(entries) {
    const list = document.getElementById('entryList');
    if (!entries.length) { list.innerHTML = '<div class="empty">这个月还没有记录</div>'; return; }
    list.innerHTML = entries.map(e => `
      <div class="entry">
        <span class="cat">${e.category || (e.type==='income'?'画稿':'其他')}</span>
        <span class="note">${e.note || '（无标题）'}<small>${e.entry_date}</small></span>
        <span class="amt ${e.type === 'expense' ? 'exp' : 'inc'}">${e.type === 'expense' ? '-' : '+'}¥${Number(e.amount).toFixed(2)}</span>
        <span class="del" onclick="delEntry(${e.id})">✕</span>
      </div>`).join('');
  }

  async function addEntry() {
    const amt = parseFloat(document.getElementById('amtInput').value);
    const note = document.getElementById('noteInput').value.trim();
    const cat = document.getElementById('catSel').value;
    const date = document.getElementById('dateInput').value || new Date().toISOString().slice(0,10);
    if (!(amt > 0)) { alert('金额要大于 0'); return; }
    const body = { entry_date: date, type: curType, amount: amt, note, category: cat };
    const r = await fetch('/api/ledger', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) { alert('保存失败：' + (d.error || '请确认已执行 setup_ledger_v2.sql')); return; }
    document.getElementById('amtInput').value = '';
    document.getElementById('noteInput').value = '';
    load();
  }
  async function delEntry(id) {
    if (!confirm('删除这笔记录？')) return;
    await fetch('/api/ledger/' + id, { method: 'DELETE' });
    load();
  }
  async function saveBudget() {
    const v = parseFloat(document.getElementById('budgetInput').value);
    if (!(v >= 0)) { alert('预算要 >= 0'); return; }
    const r = await fetch('/api/ledger/budget', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ month: curMonth, expense_budget: v }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) { alert('保存失败：' + (d.error || '请确认已执行 setup_ledger_v2.sql')); return; }
    load();
  }

  setType('expense');
  const di = document.getElementById('dateInput');
  di.value = new Date().toISOString().slice(0,10);
  load();
</script>
</body>
</html>
