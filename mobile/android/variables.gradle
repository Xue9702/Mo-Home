ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    // ⚠️ targetSdk 固定 35，不要升到 36！
    // 原因：主题里靠 android:windowOptOutEdgeToEdgeEnforcement=true 关掉强制边到边，
    // 而这个逃生门对 targetSdk ≥ 36 的应用【被 Android 16 忽略】→ 内容会顶进状态栏、
    // 压在导航条上（2026/10 雪的手机升到 Android 16 后就是这样突然错位的，代码一行没改）。
    // 另外 Android WebView 不报 env(safe-area-inset-*)，所以没法用 CSS 补内边距。
    // 将来要升 36，必须先在 MainActivity 里处理 window insets（或用 safe-area 插件）。
    targetSdkVersion = 35
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}